<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ShelfCheck</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      height: 100vh;
      height: 100dvh;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ─────────────────────────────────────── */

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #1c1c1c;
      border-bottom: 1px solid #2c2c2c;
    }

    .app-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #e0e0e0;
    }

    .section-tabs {
      display: flex;
      background: #2c2c2c;
      border-radius: 8px;
      padding: 3px;
    }

    .tab-btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #888;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
      user-select: none;
    }

    .tab-btn.active {
      background: #f0f0f0;
      color: #111;
    }

    /* ── Camera area ─────────────────────────────────── */

    .camera-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
      min-height: 0;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #snapshot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    /* Guide overlay */
    .guide {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guide-box {
      width: 94%;
      aspect-ratio: 3 / 4;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      position: relative;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.30);
    }

    .guide-box::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px;
      width: 18px; height: 18px;
      border-top: 2.5px solid rgba(255, 255, 255, 0.85);
      border-left: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 3px 0 0 0;
    }
    .guide-box::after {
      content: '';
      position: absolute;
      bottom: -2px; right: -2px;
      width: 18px; height: 18px;
      border-bottom: 2.5px solid rgba(255, 255, 255, 0.85);
      border-right: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 0 3px 0;
    }
    .guide-box > i {
      display: block;
      position: absolute;
      inset: 0;
    }
    .guide-box > i::before {
      content: '';
      position: absolute;
      top: -2px; right: -2px;
      width: 18px; height: 18px;
      border-top: 2.5px solid rgba(255, 255, 255, 0.85);
      border-right: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 3px 0 0;
    }
    .guide-box > i::after {
      content: '';
      position: absolute;
      bottom: -2px; left: -2px;
      width: 18px; height: 18px;
      border-bottom: 2.5px solid rgba(255, 255, 255, 0.85);
      border-left: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 0 0 3px;
    }

    .guide-label {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    /* Camera error state */
    .cam-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px;
      text-align: center;
      color: #666;
      z-index: 20;
    }
    .cam-error.show { display: flex; }
    .cam-error p { font-size: 14px; line-height: 1.65; max-width: 260px; }

    /* Zoom indicator */
    .zoom-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    /* Capture flash */
    @keyframes flash {
      0%   { opacity: 0.7; }
      100% { opacity: 0; }
    }
    .capture-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      pointer-events: none;
      z-index: 18;
      animation: flash 0.25s ease-out forwards;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 32px;
    }
    .loading-text {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .loading-bar {
      width: 100%;
      max-width: 260px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: #2563eb;
      border-radius: 999px;
      transition: width 0.12s linear;
    }
    .loading-pct {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Results overlay */
    .results-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 20px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .overlay-badge {
      font-size: 14px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
    }
    .badge-ok           { background: #14532d; color: #4ade80; }
    .badge-warn         { background: #450a0a; color: #f87171; }
    .badge-unverifiable { background: #713f12; color: #fde047; }

    .btn-new-scan {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    /* ── Footer ──────────────────────────────────────── */

    .footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: #1c1c1c;
      border-top: 1px solid #2c2c2c;
      min-height: 88px;
    }

    .capture-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background 0.1s ease;
    }
    .capture-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.22);
    }
    .capture-btn-dot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
    }

    .action-btns {
      display: none;
      gap: 12px;
    }
    .action-btns.show { display: flex; }

    .btn {
      padding: 13px 26px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.96); }

    .btn-retake {
      background: #2e2e2e;
      color: #ddd;
    }

    .btn-analyze {
      background: #2563eb;
      color: #fff;
    }
    .btn-analyze:disabled {
      background: #1a2f5e;
      color: #4e71b5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <span class="app-name">ShelfCheck</span>
    <div class="section-tabs" role="group" aria-label="Collection section">
      <button class="tab-btn active" data-section="fiction">Fiction</button>
      <button class="tab-btn"        data-section="nonfiction">Nonfiction</button>
    </div>
  </header>

  <div class="camera-wrap" id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="snapshot"></canvas>
    <div class="zoom-indicator" id="zoomIndicator"></div>

    <div class="guide" id="guide">
      <div class="guide-box">
        <i></i>
        <span class="guide-label">Frame the shelf here</span>
      </div>
    </div>

    <div class="cam-error" id="camError">
      <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
      <p>Camera access is required.<br>Please allow permissions and reload.</p>
    </div>
  </div>

  <footer class="footer">
    <button class="capture-btn" id="captureBtn" aria-label="Capture photo">
      <div class="capture-btn-dot"></div>
    </button>
    <div class="action-btns" id="actionBtns">
      <button class="btn btn-retake"  id="retakeBtn">Retake</button>
      <button class="btn btn-analyze" id="analyzeBtn" disabled>Analyze</button>
    </div>
  </footer>

  <script>
    const video       = document.getElementById('video');
    const snapshot    = document.getElementById('snapshot');
    const captureBtn  = document.getElementById('captureBtn');
    const actionBtns  = document.getElementById('actionBtns');
    const retakeBtn   = document.getElementById('retakeBtn');
    const analyzeBtn  = document.getElementById('analyzeBtn');
    const guide       = document.getElementById('guide');
    const camError    = document.getElementById('camError');
    const cameraWrap  = document.getElementById('cameraWrap');
    const zoomIndicator = document.getElementById('zoomIndicator');

    // Section toggle
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ── Camera + zoom setup ───────────────────────────────
    let videoTrack = null;
    let zoomCaps   = null;
    let currentZoom = 1;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width:  { ideal: 1920 },
            height: { ideal: 1080 },
          },
          audio: false,
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        const caps = videoTrack.getCapabilities?.() || {};
        if (caps.zoom) {
          zoomCaps    = caps.zoom;
          currentZoom = caps.zoom.min || 1;
        }
      } catch {
        video.style.display = 'none';
        guide.style.display = 'none';
        camError.classList.add('show');
        captureBtn.disabled      = true;
        captureBtn.style.opacity = '0.35';
      }
    }

    // ── Pinch to zoom ─────────────────────────────────────
    let lastPinchDist = null;
    let zoomHideTimer = null;

    function getPinchDist(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function showZoom(zoom) {
      zoomIndicator.textContent = zoom.toFixed(1) + '×';
      zoomIndicator.style.opacity = '1';
      clearTimeout(zoomHideTimer);
      zoomHideTimer = setTimeout(() => zoomIndicator.style.opacity = '0', 1500);
    }

    cameraWrap.addEventListener('touchstart', e => {
      if (e.touches.length === 2) lastPinchDist = getPinchDist(e.touches);
    }, { passive: true });

    cameraWrap.addEventListener('touchmove', e => {
      if (e.touches.length !== 2 || lastPinchDist === null) return;
      const dist  = getPinchDist(e.touches);
      const delta = dist / lastPinchDist;
      lastPinchDist = dist;

      if (zoomCaps && videoTrack) {
        currentZoom = Math.min(zoomCaps.max, Math.max(zoomCaps.min, currentZoom * delta));
        videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] }).catch(() => {});
        showZoom(currentZoom);
      }
    }, { passive: true });

    cameraWrap.addEventListener('touchend', e => {
      if (e.touches.length < 2) lastPinchDist = null;
    }, { passive: true });

    // ── Capture: crop to guide box ───────────────────────
    function capture() {
      const cw  = cameraWrap.clientWidth;
      const ch  = cameraWrap.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      const vw  = video.videoWidth  || cw;
      const vh  = video.videoHeight || ch;

      // Guide box dimensions in screen coords (matches CSS: width 94%, aspect 3:4)
      const gwScreen = cw * 0.94;
      const ghScreen = gwScreen * 4 / 3;
      const gxScreen = cw * 0.03;
      const gyScreen = (ch - ghScreen) / 2;

      // Video is displayed with object-fit:cover — map screen back to video coords
      const scale     = Math.max(cw / vw, ch / vh);
      const offsetX   = (cw - vw * scale) / 2;
      const offsetY   = (ch - vh * scale) / 2;
      const gxVideo   = (gxScreen - offsetX) / scale;
      const gyVideo   = (gyScreen - offsetY) / scale;
      const gwVideo   = gwScreen / scale;
      const ghVideo   = ghScreen / scale;

      // Canvas at display-pixel resolution, matching guide aspect ratio
      snapshot.width  = Math.round(gwScreen * dpr);
      snapshot.height = Math.round(ghScreen * dpr);

      snapshot.getContext('2d').drawImage(
        video,
        gxVideo, gyVideo, gwVideo, ghVideo,
        0, 0, snapshot.width, snapshot.height
      );

      // Flash animation
      const flash = document.createElement('div');
      flash.className = 'capture-flash';
      cameraWrap.appendChild(flash);
      flash.addEventListener('animationend', () => flash.remove());

      snapshot.style.display   = 'block';
      guide.style.display      = 'none';
      captureBtn.style.display = 'none';
      actionBtns.classList.add('show');
      analyzeBtn.disabled = false;
    }

    // ── Retake ────────────────────────────────────────────
    function retake() {
      snapshot.style.display   = 'none';
      guide.style.display      = '';
      captureBtn.style.display = '';
      actionBtns.classList.remove('show');
      analyzeBtn.disabled      = true;
      analyzeBtn.textContent   = 'Analyze';
    }

    captureBtn.addEventListener('click', capture);
    retakeBtn.addEventListener('click', retake);

    // ── Gemini API ────────────────────────────────────────
    const GEMINI_URL = 'https://selfcheck-proxy.krish-sundareswar.workers.dev/';

    function getSection() {
      return document.querySelector('.tab-btn.active').dataset.section;
    }

    function buildPrompt(section) {
      return `You are reading a library bookshelf photo. Identify every individual book spine visible, ordered left to right (and top to bottom across multiple shelves).

For each spine, return:
- position: 1-indexed reading order
- title: as printed on the spine, or null if unreadable
- author_last: author's last name only, or null
- call_number: Dewey number (for nonfiction), or null
- spine_label: the text printed on the white library sticker at the BOTTOM of the spine (e.g. "KIN" for a Stephen King novel, or "973.7 HAR" for nonfiction). This is the actual filing key the library uses. If no sticker is visible, return null.
- confidence: "high" | "medium" | "low" based on how clearly you can read the spine
- bounding_box: [ymin, xmin, ymax, xmax] in normalized 0-1000 coordinates (0,0 = top-left)

CRITICAL bounding box rules:
- Each box must hug ONLY ONE spine — tight to its left, right, top, and bottom edges
- Do NOT include the shelf, the gap between books, or adjacent spines
- Spines are vertical: boxes should be tall and narrow
- For a spine that runs the full height of a shelf, ymin = top of shelf, ymax = bottom of shelf
- xmin and xmax should hug ONLY the spine's own width — not its neighbor
- Before returning each box, verify: "does this rectangle contain exactly one spine and nothing else?"

Section type: ${section.toUpperCase()}
Return ONLY valid JSON. Use null for unreadable fields — never guess.
Example: [{"position":1,"title":"Dune","author_last":"Herbert","call_number":null,"spine_label":"HER","confidence":"high","bounding_box":[80,50,920,140]}]`;
    }

    // Enhance image: contrast/saturation/brightness (GPU filter) + 3×3 sharpening
    function preprocessImage(srcCanvas) {
      const W = srcCanvas.width;
      const H = srcCanvas.height;
      const dst = document.createElement('canvas');
      dst.width  = W;
      dst.height = H;
      const ctx = dst.getContext('2d');

      // GPU-accelerated CSS filters
      ctx.filter = 'contrast(1.25) saturate(1.15) brightness(1.05)';
      ctx.drawImage(srcCanvas, 0, 0);
      ctx.filter = 'none';

      // Mild 3×3 sharpening convolution: [0,-1,0, -1,5,-1, 0,-1,0]
      const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];
      const id  = ctx.getImageData(0, 0, W, H);
      const src = new Uint8ClampedArray(id.data);
      const out = id.data;

      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          for (let c = 0; c < 3; c++) {
            let v = 0;
            for (let ky = -1; ky <= 1; ky++) {
              for (let kx = -1; kx <= 1; kx++) {
                v += src[((y + ky) * W + (x + kx)) * 4 + c] * kernel[(ky + 1) * 3 + (kx + 1)];
              }
            }
            out[(y * W + x) * 4 + c] = Math.max(0, Math.min(255, v));
          }
        }
      }
      ctx.putImageData(id, 0, 0);
      return dst;
    }

    // Resize snapshot to max 1280px on long side, JPEG quality 0.78, then enhance
    function getResizedImageData(maxDim = 1280, quality = 0.78) {
      const W = snapshot.width;
      const H = snapshot.height;
      const scale = Math.min(1, maxDim / Math.max(W, H));

      const tmp  = document.createElement('canvas');
      tmp.width  = Math.round(W * scale);
      tmp.height = Math.round(H * scale);
      tmp.getContext('2d').drawImage(snapshot, 0, 0, tmp.width, tmp.height);

      const enhanced = preprocessImage(tmp);
      return enhanced.toDataURL('image/jpeg', quality).split(',')[1];
    }

    let loadingTimer = null;

    function showLoading() {
      const overlay = document.createElement('div');
      overlay.id        = 'loadingOverlay';
      overlay.className = 'loading-overlay';
      overlay.innerHTML = `
        <div class="loading-text">READING SPINES…</div>
        <div class="loading-bar"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
        <div class="loading-pct" id="loadingPct">0%</div>`;
      cameraWrap.appendChild(overlay);

      // Simulate progress: ease toward 85% over ~5s, then crawl toward 95%
      const fill = document.getElementById('loadingBarFill');
      const pct  = document.getElementById('loadingPct');
      const start = performance.now();
      const EASE_DURATION = 5000;  // reach 85% in 5s
      loadingTimer = setInterval(() => {
        const t = (performance.now() - start) / EASE_DURATION;
        let p;
        if (t < 1) {
          p = 85 * (1 - Math.pow(1 - t, 2));  // ease-out to 85
        } else {
          p = Math.min(95, 85 + (t - 1) * 2);  // crawl 85→95
        }
        fill.style.width = p + '%';
        pct.textContent  = Math.round(p) + '%';
      }, 100);
    }

    function hideLoading(success = true) {
      clearInterval(loadingTimer);
      const fill = document.getElementById('loadingBarFill');
      const pct  = document.getElementById('loadingPct');
      if (fill && success) {
        fill.style.width = '100%';
        if (pct) pct.textContent = '100%';
        setTimeout(() => document.getElementById('loadingOverlay')?.remove(), 200);
      } else {
        document.getElementById('loadingOverlay')?.remove();
      }
    }

    async function analyzeShelf() {
      analyzeBtn.disabled    = true;
      analyzeBtn.textContent = 'Analyzing…';
      showLoading();

      const imageData = getResizedImageData();
      const section   = getSection();
      let success = false;

      try {
        const res = await fetch(GEMINI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: buildPrompt(section) },
                { inline_data: { mime_type: 'image/jpeg', data: imageData } }
              ]
            }]
          })
        });

        if (!res.ok) {
          const errText = await res.text();
          console.error('Gemini error:', errText);
          throw new Error(`API error ${res.status}: ${errText.slice(0, 200)}`);
        }

        const json    = await res.json();
        const raw     = json.candidates[0].content.parts[0].text;
        const cleaned = raw.replace(/```json|```/g, '').trim();
        const books   = JSON.parse(cleaned);

        success = true;
        showResults(books, section);
      } catch (err) {
        alert('Something went wrong: ' + err.message);
        analyzeBtn.disabled    = false;
        analyzeBtn.textContent = 'Analyze';
      } finally {
        hideLoading(success);
      }
    }

    // ── Ordering logic ────────────────────────────────────

    // Parse a Dewey/cutter label like "973.7 HAR" or "KIN"
    function parseDewey(s) {
      if (!s) return null;
      const m = s.match(/^\s*([0-9]+(?:\.[0-9]+)?|[A-Za-z]+)\s*([A-Za-z]+)?/i);
      if (!m) return null;
      const num = isNaN(parseFloat(m[1])) ? null : parseFloat(m[1]);
      const cut = (m[2] || '').toLowerCase();
      return { num, cut, prefix: m[1].toLowerCase() };
    }

    function checkOrder(books, section) {
      function sortKey(book) {
        if (section === 'fiction') {
          return book.spine_label?.toLowerCase() || book.author_last?.toLowerCase() || null;
        } else {
          return parseDewey(book.spine_label) || parseDewey(book.call_number) || null;
        }
      }

      return books.map((book, i) => {
        const keyB = sortKey(book);
        if (i === 0) return { ...book, outOfOrder: false, unverifiable: keyB === null };
        const prev = books[i - 1];
        const keyA = sortKey(prev);

        // Can't verify order when this book has no key
        if (keyB === null) return { ...book, outOfOrder: false, unverifiable: true };
        // Previous book was unverifiable — can't compare, but this one is readable
        if (keyA === null) return { ...book, outOfOrder: false, unverifiable: false };

        if (section === 'fiction') {
          // keyA/keyB are strings — use localeCompare for Mc/Mac etc.
          const cmp = keyB.localeCompare(keyA, undefined, { sensitivity: 'base' });
          return { ...book, outOfOrder: cmp < 0, unverifiable: false };
        } else {
          // keyA/keyB are parseDewey objects
          let outOfOrder = false;
          if (keyA.num !== null && keyB.num !== null) {
            if (keyB.num < keyA.num) {
              outOfOrder = true;
            } else if (keyB.num === keyA.num) {
              outOfOrder = keyB.cut.localeCompare(keyA.cut, undefined, { sensitivity: 'base' }) < 0;
            }
          } else {
            outOfOrder = keyB.prefix.localeCompare(keyA.prefix, undefined, { sensitivity: 'base' }) < 0;
          }
          return { ...book, outOfOrder, unverifiable: false };
        }
      });
    }

    // ── Results: draw boxes on photo + overlay summary ────
    function showResults(books, section) {
      const checked  = checkOrder(books, section);
      const outCount = checked.filter(b => b.outOfOrder).length;
      const unvCount = checked.filter(b => b.unverifiable).length;

      const ctx = snapshot.getContext('2d');
      const W   = snapshot.width;
      const H   = snapshot.height;

      checked.forEach(book => {
        if (!book.bounding_box) return;
        const [ymin, xmin, ymax, xmax] = book.bounding_box;
        const x = (xmin / 1000) * W;
        const y = (ymin / 1000) * H;
        const w = ((xmax - xmin) / 1000) * W;
        const h = ((ymax - ymin) / 1000) * H;

        // Three-state color: red = out of order, yellow = unverifiable, green = ok
        const color = book.outOfOrder ? '#ef4444' : book.unverifiable ? '#facc15' : '#22c55e';

        ctx.strokeStyle = color;
        ctx.lineWidth   = Math.max(3, W / 250);
        ctx.strokeRect(x, y, w, h);

        const fontSize = Math.max(18, W / 55);
        const pillW    = fontSize * 1.8;
        const pillH    = fontSize * 1.4;
        ctx.fillStyle  = color;
        ctx.beginPath();
        ctx.roundRect(x, y - pillH, pillW, pillH, 4);
        ctx.fill();

        ctx.fillStyle = book.unverifiable ? '#000' : '#fff';
        ctx.font      = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(book.position, x + pillW / 2, y - pillH / 4);
        ctx.textAlign = 'left';
      });

      let badgeClass, badgeText;
      if (outCount > 0) {
        badgeClass = 'badge-warn';
        badgeText  = `⚠ ${outCount} out of order`;
      } else if (unvCount > 0) {
        badgeClass = 'badge-unverifiable';
        badgeText  = `⚠ ${unvCount} unverifiable`;
      } else {
        badgeClass = 'badge-ok';
        badgeText  = '✓ All in order';
      }

      const overlay = document.createElement('div');
      overlay.id        = 'resultsOverlay';
      overlay.className = 'results-overlay';
      overlay.innerHTML = `
        <div class="overlay-badge ${badgeClass}">
          ${badgeText}
        </div>
        <button class="btn-new-scan" onclick="newScan()">New Scan</button>`;
      cameraWrap.appendChild(overlay);

      actionBtns.classList.remove('show');
    }

    function newScan() {
      document.getElementById('resultsOverlay')?.remove();
      retake();
    }

    analyzeBtn.addEventListener('click', analyzeShelf);

    // Auto-start camera on load
    startCamera();
  </script>

</body>
</html>
