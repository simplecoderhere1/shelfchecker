<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ShelfCheck</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      height: 100vh;
      height: 100dvh;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ─────────────────────────────────────── */

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #1c1c1c;
      border-bottom: 1px solid #2c2c2c;
    }

    .app-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #e0e0e0;
    }

    .section-tabs {
      display: flex;
      background: #2c2c2c;
      border-radius: 8px;
      padding: 3px;
    }

    .tab-btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #888;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
      user-select: none;
    }

    .tab-btn.active {
      background: #f0f0f0;
      color: #111;
    }

    /* ── Camera area ─────────────────────────────────── */

    .camera-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
      min-height: 0;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #snapshot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    /* Guide overlay */
    .guide {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guide-box {
      width: 86%;
      aspect-ratio: 16 / 6;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      position: relative;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.30);
    }

    .guide-box::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px;
      width: 18px; height: 18px;
      border-top: 2.5px solid rgba(255, 255, 255, 0.85);
      border-left: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 3px 0 0 0;
    }
    .guide-box::after {
      content: '';
      position: absolute;
      bottom: -2px; right: -2px;
      width: 18px; height: 18px;
      border-bottom: 2.5px solid rgba(255, 255, 255, 0.85);
      border-right: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 0 3px 0;
    }
    .guide-box > i {
      display: block;
      position: absolute;
      inset: 0;
    }
    .guide-box > i::before {
      content: '';
      position: absolute;
      top: -2px; right: -2px;
      width: 18px; height: 18px;
      border-top: 2.5px solid rgba(255, 255, 255, 0.85);
      border-right: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 3px 0 0;
    }
    .guide-box > i::after {
      content: '';
      position: absolute;
      bottom: -2px; left: -2px;
      width: 18px; height: 18px;
      border-bottom: 2.5px solid rgba(255, 255, 255, 0.85);
      border-left: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 0 0 3px;
    }

    .guide-label {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    /* Camera error state */
    .cam-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px;
      text-align: center;
      color: #666;
      z-index: 20;
    }
    .cam-error.show { display: flex; }
    .cam-error p { font-size: 14px; line-height: 1.65; max-width: 260px; }

    /* Zoom indicator */
    .zoom-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    /* Capture flash */
    @keyframes flash {
      0%   { opacity: 0.7; }
      100% { opacity: 0; }
    }
    .capture-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      pointer-events: none;
      z-index: 18;
      animation: flash 0.25s ease-out forwards;
    }

    /* Results overlay */
    .results-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 20px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .overlay-badge {
      font-size: 14px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
    }
    .badge-ok   { background: #14532d; color: #4ade80; }
    .badge-warn { background: #450a0a; color: #f87171; }

    .btn-new-scan {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    /* ── Footer ──────────────────────────────────────── */

    .footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: #1c1c1c;
      border-top: 1px solid #2c2c2c;
      min-height: 88px;
    }

    .capture-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background 0.1s ease;
    }
    .capture-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.22);
    }
    .capture-btn-dot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
    }

    .action-btns {
      display: none;
      gap: 12px;
    }
    .action-btns.show { display: flex; }

    .btn {
      padding: 13px 26px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.96); }

    .btn-retake {
      background: #2e2e2e;
      color: #ddd;
    }

    .btn-analyze {
      background: #2563eb;
      color: #fff;
    }
    .btn-analyze:disabled {
      background: #1a2f5e;
      color: #4e71b5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <span class="app-name">ShelfCheck</span>
    <div class="section-tabs" role="group" aria-label="Collection section">
      <button class="tab-btn active" data-section="fiction">Fiction</button>
      <button class="tab-btn"        data-section="nonfiction">Nonfiction</button>
    </div>
  </header>

  <div class="camera-wrap" id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="snapshot"></canvas>
    <div class="zoom-indicator" id="zoomIndicator"></div>

    <div class="guide" id="guide">
      <div class="guide-box">
        <i></i>
        <span class="guide-label">Frame the shelf here</span>
      </div>
    </div>

    <div class="cam-error" id="camError">
      <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
      <p>Camera access is required.<br>Please allow permissions and reload.</p>
    </div>
  </div>

  <footer class="footer">
    <button class="capture-btn" id="captureBtn" aria-label="Capture photo">
      <div class="capture-btn-dot"></div>
    </button>
    <div class="action-btns" id="actionBtns">
      <button class="btn btn-retake"  id="retakeBtn">Retake</button>
      <button class="btn btn-analyze" id="analyzeBtn" disabled>Analyze</button>
    </div>
  </footer>

  <script>
    const video       = document.getElementById('video');
    const snapshot    = document.getElementById('snapshot');
    const captureBtn  = document.getElementById('captureBtn');
    const actionBtns  = document.getElementById('actionBtns');
    const retakeBtn   = document.getElementById('retakeBtn');
    const analyzeBtn  = document.getElementById('analyzeBtn');
    const guide       = document.getElementById('guide');
    const camError    = document.getElementById('camError');
    const cameraWrap  = document.getElementById('cameraWrap');
    const zoomIndicator = document.getElementById('zoomIndicator');

    // Section toggle
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ── Camera + zoom setup ───────────────────────────────
    let videoTrack = null;
    let zoomCaps   = null;
    let currentZoom = 1;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width:  { ideal: 1920 },
            height: { ideal: 1080 },
          },
          audio: false,
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        const caps = videoTrack.getCapabilities?.() || {};
        if (caps.zoom) {
          zoomCaps    = caps.zoom;
          currentZoom = caps.zoom.min || 1;
        }
      } catch {
        video.style.display = 'none';
        guide.style.display = 'none';
        camError.classList.add('show');
        captureBtn.disabled      = true;
        captureBtn.style.opacity = '0.35';
      }
    }

    // ── Pinch to zoom ─────────────────────────────────────
    let lastPinchDist = null;
    let zoomHideTimer = null;

    function getPinchDist(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function showZoom(zoom) {
      zoomIndicator.textContent = zoom.toFixed(1) + '×';
      zoomIndicator.style.opacity = '1';
      clearTimeout(zoomHideTimer);
      zoomHideTimer = setTimeout(() => zoomIndicator.style.opacity = '0', 1500);
    }

    cameraWrap.addEventListener('touchstart', e => {
      if (e.touches.length === 2) lastPinchDist = getPinchDist(e.touches);
    }, { passive: true });

    cameraWrap.addEventListener('touchmove', e => {
      if (e.touches.length !== 2 || lastPinchDist === null) return;
      const dist  = getPinchDist(e.touches);
      const delta = dist / lastPinchDist;
      lastPinchDist = dist;

      if (zoomCaps && videoTrack) {
        currentZoom = Math.min(zoomCaps.max, Math.max(zoomCaps.min, currentZoom * delta));
        videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] }).catch(() => {});
        showZoom(currentZoom);
      }
    }, { passive: true });

    cameraWrap.addEventListener('touchend', e => {
      if (e.touches.length < 2) lastPinchDist = null;
    }, { passive: true });

    // ── Capture: instant shot with flash ─────────────────
    function capture() {
      const cw  = cameraWrap.clientWidth;
      const ch  = cameraWrap.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      const vw  = video.videoWidth  || cw;
      const vh  = video.videoHeight || ch;

      // Draw at display-pixel resolution (sharp on retina)
      snapshot.width  = Math.round(cw * dpr);
      snapshot.height = Math.round(ch * dpr);

      const scale = Math.max(snapshot.width / vw, snapshot.height / vh);
      const sw = vw * scale;
      const sh = vh * scale;
      snapshot.getContext('2d').drawImage(
        video,
        (snapshot.width  - sw) / 2,
        (snapshot.height - sh) / 2,
        sw, sh
      );

      // Flash animation
      const flash = document.createElement('div');
      flash.className = 'capture-flash';
      cameraWrap.appendChild(flash);
      flash.addEventListener('animationend', () => flash.remove());

      snapshot.style.display   = 'block';
      guide.style.display      = 'none';
      captureBtn.style.display = 'none';
      actionBtns.classList.add('show');
      analyzeBtn.disabled = false;
    }

    // ── Retake ────────────────────────────────────────────
    function retake() {
      snapshot.style.display   = 'none';
      guide.style.display      = '';
      captureBtn.style.display = '';
      actionBtns.classList.remove('show');
      analyzeBtn.disabled      = true;
      analyzeBtn.textContent   = 'Analyze';
    }

    captureBtn.addEventListener('click', capture);
    retakeBtn.addEventListener('click', retake);

    // ── Gemini API ────────────────────────────────────────
    const GEMINI_API_KEY = 'AIzaSyCv7dW3TkORFUYEo1_5zDOGZReSLqMYuK4';
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;

    function getSection() {
      return document.querySelector('.tab-btn.active').dataset.section;
    }

    function buildPrompt(section) {
      return `You are reading a library bookshelf photo. List every book spine visible, left to right.
Return ONLY valid JSON — an array of objects with these fields: position, title, author_last, call_number, confidence, bounding_box.
bounding_box should be [ymin, xmin, ymax, xmax] with values 0-1000 (0,0 = top-left of image). Draw a tight box around each book spine.
Section type: ${section.toUpperCase()}
If a field is unreadable, use null. Do not guess. Confidence should be "high", "medium", or "low".
Example: [{"position":1,"title":"Dune","author_last":"Herbert","call_number":null,"confidence":"high","bounding_box":[100,50,900,150]}]`;
    }

    async function analyzeShelf() {
      analyzeBtn.disabled    = true;
      analyzeBtn.textContent = 'Analyzing…';

      const imageData = snapshot.toDataURL('image/jpeg', 0.92).split(',')[1];
      const section   = getSection();

      try {
        const res = await fetch(GEMINI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: buildPrompt(section) },
                { inline_data: { mime_type: 'image/jpeg', data: imageData } }
              ]
            }]
          })
        });

        if (!res.ok) {
          const errText = await res.text();
          console.error('Gemini error:', errText);
          throw new Error(`API error ${res.status}: ${errText.slice(0, 200)}`);
        }

        const json    = await res.json();
        const raw     = json.candidates[0].content.parts[0].text;
        const cleaned = raw.replace(/```json|```/g, '').trim();
        const books   = JSON.parse(cleaned);

        showResults(books, section);
      } catch (err) {
        alert('Something went wrong: ' + err.message);
        analyzeBtn.disabled    = false;
        analyzeBtn.textContent = 'Analyze';
      }
    }

    // ── Ordering logic ────────────────────────────────────
    function checkOrder(books, section) {
      return books.map((book, i) => {
        if (i === 0) return { ...book, outOfOrder: false };
        const prev = books[i - 1];

        if (section === 'fiction') {
          const a = (prev.author_last || '').toLowerCase();
          const b = (book.author_last || '').toLowerCase();
          const outOfOrder = b < a || (b === a && (book.title || '').toLowerCase() < (prev.title || '').toLowerCase());
          return { ...book, outOfOrder };
        } else {
          const a = parseFloat(prev.call_number) || 0;
          const b = parseFloat(book.call_number) || 0;
          const outOfOrder = b < a || (b === a && (book.author_last || '').toLowerCase() < (prev.author_last || '').toLowerCase());
          return { ...book, outOfOrder };
        }
      });
    }

    // ── Results: draw boxes on photo + overlay summary ────
    function showResults(books, section) {
      const checked  = checkOrder(books, section);
      const outCount = checked.filter(b => b.outOfOrder).length;

      const ctx = snapshot.getContext('2d');
      const W   = snapshot.width;
      const H   = snapshot.height;

      checked.forEach(book => {
        if (!book.bounding_box) return;
        const [ymin, xmin, ymax, xmax] = book.bounding_box;
        const x = (xmin / 1000) * W;
        const y = (ymin / 1000) * H;
        const w = ((xmax - xmin) / 1000) * W;
        const h = ((ymax - ymin) / 1000) * H;

        const color = book.outOfOrder ? '#ef4444' : '#22c55e';

        ctx.strokeStyle = color;
        ctx.lineWidth   = Math.max(3, W / 250);
        ctx.strokeRect(x, y, w, h);

        const fontSize = Math.max(18, W / 55);
        const pillW    = fontSize * 1.8;
        const pillH    = fontSize * 1.4;
        ctx.fillStyle  = color;
        ctx.beginPath();
        ctx.roundRect(x, y - pillH, pillW, pillH, 4);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font      = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(book.position, x + pillW / 2, y - pillH / 4);
        ctx.textAlign = 'left';
      });

      const overlay = document.createElement('div');
      overlay.id        = 'resultsOverlay';
      overlay.className = 'results-overlay';
      overlay.innerHTML = `
        <div class="overlay-badge ${outCount > 0 ? 'badge-warn' : 'badge-ok'}">
          ${outCount > 0 ? `⚠ ${outCount} out of order` : '✓ All in order'}
        </div>
        <button class="btn-new-scan" onclick="newScan()">New Scan</button>`;
      cameraWrap.appendChild(overlay);

      actionBtns.classList.remove('show');
    }

    function newScan() {
      document.getElementById('resultsOverlay')?.remove();
      retake();
    }

    analyzeBtn.addEventListener('click', analyzeShelf);

    // Auto-start camera on load
    startCamera();
  </script>

</body>
</html>
