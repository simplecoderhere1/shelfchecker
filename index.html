<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ShelfCheck</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      height: 100vh;
      height: 100dvh;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ─────────────────────────────────────── */

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #1c1c1c;
      border-bottom: 1px solid #2c2c2c;
    }

    .app-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #e0e0e0;
    }

    .section-tabs {
      display: flex;
      background: #2c2c2c;
      border-radius: 8px;
      padding: 3px;
    }

    .tab-btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #888;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
      user-select: none;
    }

    .tab-btn.active {
      background: #f0f0f0;
      color: #111;
    }

    /* ── Camera area ─────────────────────────────────── */

    .camera-wrap {
      flex: 1;
      position: relative;
      background: #000;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .photo-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    /* Idle placeholder shown before any photo is loaded */
    .photo-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #555;
    }
    .photo-placeholder svg { opacity: 0.45; }
    .photo-placeholder p { font-size: 14px; line-height: 1.6; text-align: center; max-width: 220px; }

    #snapshot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 32px;
    }
    .loading-text {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-align: center;
      line-height: 1.6;
    }
    .loading-subtext {
      font-size: 12px;
      font-weight: 400;
      opacity: 0.8;
      text-transform: lowercase;
    }

    /* Results overlay */
    .results-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 20px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .overlay-badge {
      font-size: 14px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
    }
    .badge-ok           { background: #14532d; color: #4ade80; }
    .badge-warn         { background: #450a0a; color: #f87171; }
    .badge-unverifiable { background: #713f12; color: #fde047; }

    /* Small highlight over the white label at the foot of a flagged spine */
    .book-boxes {
      position: absolute;
      inset: 0;
      z-index: 19;
      pointer-events: none;   /* taps fall through to the snapshot for inspect */
    }
    .label-mark {
      position: absolute;
      border-radius: 3px;
      box-sizing: border-box;
    }
    .label-mark-bad {
      border: 2px solid #ef4444;
      background: rgba(239, 68, 68, 0.35);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 10px rgba(239,68,68,0.6);
    }
    .label-mark-unv {
      border: 2px solid #facc15;
      background: rgba(250, 204, 21, 0.30);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
    }

    /* Inline error banner */
    .error-banner {
      position: absolute;
      left: 12px; right: 12px;
      bottom: 16px;
      z-index: 26;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .error-banner-msg { font-size: 13px; color: #fecaca; line-height: 1.4; }
    .error-banner-retry {
      flex-shrink: 0;
      background: #ef4444;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* First-run hint / legend */
    .first-hint {
      position: absolute;
      inset: 0;
      z-index: 24;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    .first-hint-card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 22px 20px;
      max-width: 320px;
      text-align: left;
    }
    .first-hint-card h3 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 12px;
      text-align: center;
    }
    .first-hint-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 11px;
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
    }
    .first-hint-dot {
      flex-shrink: 0;
      width: 16px; height: 16px;
      border-radius: 50%;
      margin-top: 1px;
    }
    .first-hint-btn {
      width: 100%;
      margin-top: 8px;
      background: #2563eb;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-new-scan {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    /* Tap-to-inspect popup */
    .book-inspect {
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      z-index: 30;
      width: min(86%, 320px);
      background: rgba(20, 20, 20, 0.96);
      backdrop-filter: blur(6px);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px 16px 12px;
      font-size: 13px;
      color: #eee;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .bi-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
    .bi-key {
      color: #888;
      flex-shrink: 0;
    }
    .bi-val {
      color: #eee;
      text-align: right;
      word-break: break-word;
    }
    .bi-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .bi-status {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2c2c2c;
      font-weight: 600;
      color: #cbd5e1;
      text-align: center;
    }
    .bi-close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* ── Debug mode ─────────────────────────────────── */
    .debug-badge {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc2626;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border-radius: 6px;
      z-index: 50;
      pointer-events: none;
    }

    /* On-screen timing readout (Debug Mode only) — shows where each scan spends time */
    .timing-badge {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #dc2626;
      color: #fff;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding: 8px 14px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .timing-badge b { color: #f87171; }

    .settings-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .settings-btn:active { color: #fff; }
    .settings-btn.debug-active { color: #dc2626; }

    .settings-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 8px 0;
      z-index: 50;
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .settings-menu.show { display: block; }
    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      font-size: 13px;
      color: #ddd;
      cursor: pointer;
      user-select: none;
    }
    .settings-item:active { background: #2c2c2c; }
    .settings-toggle {
      width: 36px; height: 20px;
      border-radius: 10px;
      background: #444;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .settings-toggle.on { background: #dc2626; }
    .settings-toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    .settings-toggle.on::after { transform: translateX(16px); }

    .debug-overlay {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: #0d0d0d;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .debug-section {
      padding: 12px 16px;
      border-bottom: 1px solid #2c2c2c;
    }
    .debug-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }
    .debug-img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .debug-prompt {
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
      background: #111;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2c2c2c;
    }
    .debug-book-table {
      width: 100%;
      font-size: 11.5px;
      border-collapse: collapse;
    }
    .debug-book-table th {
      text-align: left;
      color: #888;
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      background: #0d0d0d;
    }
    .debug-book-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #1c1c1c;
      color: #ddd;
      vertical-align: top;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .debug-book-table tr.book-ok td:first-child { border-left: 3px solid #4ade80; }
    .debug-book-table tr.book-bad td:first-child { border-left: 3px solid #ef4444; }
    .debug-book-table tr.book-unv td:first-child { border-left: 3px solid #facc15; }
    .debug-conf-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .debug-actions {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .debug-actions .btn { flex: 1; }

    /* ── Pick buttons (idle state) ──────────────────────── */
    .pick-btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 300px;
      padding: 0 24px;
    }
    .pick-btn {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.12s ease, opacity 0.12s;
    }
    .pick-btn:active { transform: scale(0.97); opacity: 0.85; }
    .pick-btn-camera { background: #2563eb; color: #fff; }
    .pick-btn-upload { background: #2e2e2e; color: #ccc; }

    /* ── Action bar overlay (shown over photo after load) ── */
    .action-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 20px 16px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,0.72));
      z-index: 21;
    }
    .action-bar.show { display: flex; }

    .btn {
      flex: 1;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn-retake  { background: rgba(46,46,46,0.92); color: #ddd; }
    .btn-analyze { background: #2563eb; color: #fff; }
    .btn-analyze:disabled {
      background: #1a2f5e;
      color: #4e71b5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Landscape layout ────────────────────────────────
       In landscape the vertical stack wastes height. Flip to a row:
       left sidebar (section tabs + settings) | camera | right sidebar (shutter).
       The camera area fills all remaining width so you see the full shelf.
    ─────────────────────────────────────────────────── */
    @media (orientation: landscape) {
      body { flex-direction: row; }

      /* Left sidebar */
      .header {
        flex-direction: column;
        width: auto;
        border-bottom: none;
        border-right: 1px solid #2c2c2c;
        padding: 8px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-left: max(8px, env(safe-area-inset-left));
        gap: 10px;
        justify-content: flex-start;
        align-items: center;
      }
      .app-name { display: none; }
      .section-tabs { flex-direction: column; }
      .tab-btn { padding: 6px 10px; font-size: 12px; }

      .pick-btns { flex-direction: row; max-width: none; padding: 0 16px; }
      .action-bar { flex-direction: row; }
    }
  </style>
</head>
<body>

  <header class="header">
    <span class="app-name">ShelfCheck</span>
    <div class="section-tabs" role="group" aria-label="Collection section">
      <button class="tab-btn active" data-section="fiction">Fiction</button>
      <button class="tab-btn"        data-section="nonfiction">Nonfiction</button>
    </div>
    <div style="position:relative">
      <button class="settings-btn" id="settingsBtn" aria-label="Settings">&#9881;</button>
      <div class="settings-menu" id="settingsMenu">
        <div class="settings-item" id="debugToggle">
          <span>Debug Mode</span>
          <div class="settings-toggle" id="debugToggleSwitch"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="camera-wrap" id="cameraWrap">
    <!-- photo-area is the containing block for canvas and all absolute overlays -->
    <div class="photo-area" id="photoArea">
      <div class="photo-placeholder" id="photoPlaceholder">
        <div class="pick-btns">
          <button class="pick-btn pick-btn-camera" id="takePicBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            Take Photo
          </button>
          <button class="pick-btn pick-btn-upload" id="uploadPicBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 16 12 12 8 16"/>
              <line x1="12" y1="12" x2="12" y2="21"/>
              <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
            </svg>
            Upload Image
          </button>
        </div>
      </div>
      <canvas id="snapshot"></canvas>
      <div class="action-bar" id="actionBar">
        <button class="btn btn-retake"  id="retakeBtn">Retake</button>
        <button class="btn btn-analyze" id="analyzeBtn" disabled>Analyze</button>
      </div>
    </div>
    <!-- loading overlay, results overlay, book-inspect appended here by JS -->
  </div>

  <input type="file" id="photoInput"  accept="image/*" capture="environment" style="display:none">
  <input type="file" id="uploadInput" accept="image/*" style="display:none">

  <script>
    const photoInput       = document.getElementById('photoInput');
    const uploadInput      = document.getElementById('uploadInput');
    const photoPlaceholder = document.getElementById('photoPlaceholder');
    const takePicBtn       = document.getElementById('takePicBtn');
    const uploadPicBtn     = document.getElementById('uploadPicBtn');
    const snapshot         = document.getElementById('snapshot');
    const actionBar        = document.getElementById('actionBar');
    const retakeBtn        = document.getElementById('retakeBtn');
    const analyzeBtn       = document.getElementById('analyzeBtn');
    const cameraWrap       = document.getElementById('cameraWrap');
    const photoArea        = document.getElementById('photoArea');
    // Section toggle — remembers the last-used section across reloads.
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        try { localStorage.setItem('shelfcheck.section', btn.dataset.section); } catch {}
      });
    });

    // Restore saved section on load
    try {
      const savedSection = localStorage.getItem('shelfcheck.section');
      if (savedSection) {
        const savedBtn = document.querySelector(`.tab-btn[data-section="${savedSection}"]`);
        if (savedBtn) {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          savedBtn.classList.add('active');
        }
      }
    } catch {}

    // ── Photo picker ──────────────────────────────────────
    function loadPhoto(file) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        snapshot.width  = img.naturalWidth;
        snapshot.height = img.naturalHeight;
        snapshot.getContext('2d').drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        photoPlaceholder.style.display = 'none';
        snapshot.style.display         = 'block';
        actionBar.classList.add('show');
        analyzeBtn.disabled = false;
      };
      img.src = url;
    }

    function retake() {
      snapshot.style.display         = 'none';
      photoPlaceholder.style.display = '';
      actionBar.classList.remove('show');
      analyzeBtn.disabled    = true;
      analyzeBtn.textContent = 'Analyze';
      photoInput.value       = '';
      uploadInput.value      = '';
    }

    takePicBtn.addEventListener('click', () => photoInput.click());
    uploadPicBtn.addEventListener('click', () => uploadInput.click());
    retakeBtn.addEventListener('click', retake);
    photoInput.addEventListener('change',  () => { if (photoInput.files[0])  loadPhoto(photoInput.files[0]); });
    uploadInput.addEventListener('change', () => { if (uploadInput.files[0]) loadPhoto(uploadInput.files[0]); });

    // ── Gemini API ────────────────────────────────────────
    const GEMINI_URL = 'https://selfcheck-proxy.krish-sundareswar.workers.dev/';

    const GEMINI_MODEL = 'gemini-3.1-flash-lite';

    function getSection() {
      return document.querySelector('.tab-btn.active').dataset.section;
    }

    function buildPrompt(section) {
      if (section === 'nonfiction') {
        return `This is a library NONFICTION shelf photo. There may be multiple shelves.
Read every book spine left-to-right, top shelf first, then lower shelves.
Return ONLY a JSON array of arrays, one per book spine.
Each inner array has exactly 4 elements:
0: full text on the white sticker at the bottom of the spine (e.g. "973.7 HAR", "KIN"), or null if unreadable.
1: book title from the spine, or null if unreadable.
2: 1 if you read the white sticker clearly, 0 if unsure.
3: bounding box of that spine as [ymin,xmin,ymax,xmax] normalized 0–1000, tight to just that one spine, never spanning neighbors or shelves.
CRITICAL for element 0: read the sticker character-by-character exactly as printed. The cutter letters come from the AUTHOR'S last name, NOT from the title. Never infer or guess the cutter from the title — e.g. "The New Organic Grower" by Coleman has sticker "635.04 COL", not "635.04 THE". If you cannot read it clearly, return null.
If a sticker is partially cut off by the edge of the image or another book, DO NOT guess the missing letters or numbers. Return null.
Never copy a neighbor's label.
Example: [["973.7 HAR","Lincoln",1,[420,10,980,85]],["KIN","The Stand",1,[420,90,980,170]]]
Example of unreadable or cropped sticker: [null, "Harry Potter", 0, [420,190,980,270]]`;
      }

      return `This is a library FICTION shelf photo. There may be multiple shelves.
Read every book spine left-to-right, top shelf first, then lower shelves.
Return ONLY a JSON array of arrays, one per book spine.
Each inner array has exactly 4 elements:
0: full text on the white sticker at the bottom of the spine (e.g. "BLACK, Cara", "BLACK, Cara 5"), or null if unreadable.
1: book title from the spine, or null if unreadable.
2: 1 if you read the white sticker clearly, 0 if unsure.
3: bounding box of that spine as [ymin,xmin,ymax,xmax] normalized 0–1000, tight to just that one spine, never spanning neighbors or shelves.
Rules: the white bottom sticker is the primary sort key — read it first. Return null and 0 for element 2 if you cannot read the sticker. Never copy a neighbor's text.
If a sticker is partially cut off by the edge of the image or another book, DO NOT guess the missing letters or numbers. Return null.
Example: [["BLACK, Cara","Murder in Clichy",1,[420,10,980,85]],["KING, Stephen","The Stand",1,[420,90,980,170]]]
Example of unreadable or cropped sticker: [null, "The Stand", 0, [420,190,980,270]]`;
    }

    // Expand the 4-element wire format [spine_label, title, confidence, box].
    function expandBook(arr) {
      const box = Array.isArray(arr[3]) && arr[3].length === 4 ? arr[3] : null;
      return {
        author_last:   null,
        title:         arr[1] ?? null,
        spine_label:   arr[0] ?? null,
        call_number:   null,
        series_volume: null,
        confidence:    arr[2] === 1 ? 'high' : 'low',
        bounding_box:  box,
      };
    }

    // Downscale via step-halving to avoid bilinear smearing on large reductions.
    function stepDownscale(srcCanvas, targetW, targetH) {
      let cur = srcCanvas;
      let cw = cur.width, ch = cur.height;
      while (cw / targetW > 2 || ch / targetH > 2) {
        const nw = Math.max(targetW, Math.ceil(cw / 2));
        const nh = Math.max(targetH, Math.ceil(ch / 2));
        const step = document.createElement('canvas');
        step.width = nw; step.height = nh;
        step.getContext('2d').drawImage(cur, 0, 0, nw, nh);
        cur = step; cw = nw; ch = nh;
      }
      if (cw !== targetW || ch !== targetH) {
        const fin = document.createElement('canvas');
        fin.width = targetW; fin.height = targetH;
        fin.getContext('2d').drawImage(cur, 0, 0, targetW, targetH);
        return fin;
      }
      return cur;
    }

    // Resize snapshot and return a single base64 JPEG for the API request.
    // 2400px / q0.82: captures the high resolution needed for tiny library stickers
    // without sacrificing too much upload speed.
    function getResizedImageData(maxDim = 2400, quality = 0.82) {
      const W = snapshot.width;
      const H = snapshot.height;
      const scale = Math.min(1, maxDim / Math.max(W, H));
      const tW = Math.round(W * scale);
      const tH = Math.round(H * scale);

      console.time('preprocess');
      const resized = stepDownscale(snapshot, tW, tH);

      // Light GPU contrast boost via CSS filter on a final drawImage pass
      const out = document.createElement('canvas');
      out.width = tW; out.height = tH;
      const ctx = out.getContext('2d');
      ctx.filter = 'contrast(1.08) saturate(1.05)';
      ctx.drawImage(resized, 0, 0);
      console.timeEnd('preprocess');

      return out.toDataURL('image/jpeg', quality).split(',')[1];
    }

    function showLoading() {
      const overlay = document.createElement('div');
      overlay.id        = 'loadingOverlay';
      overlay.className = 'loading-overlay';
      overlay.innerHTML = `
        <div class="loading-text">
          READING SPINES…<br>
          <span class="loading-subtext">(this takes around 20 seconds)</span>
        </div>`;
      photoArea.appendChild(overlay);
    }

    function hideLoading(success = true) {
      document.getElementById('loadingOverlay')?.remove();
    }

    // Call Gemini (single model, no fallback). Resolves to books array.
    async function callGemini(prompt, image) {
      const parts = [
        { text: prompt },
        { inline_data: { mime_type: 'image/jpeg', data: image } },
      ];

      console.time('gemini');
      let res;
      try {
        res = await fetch(GEMINI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: GEMINI_MODEL,
            generationConfig: {
              temperature: 0,
              response_mime_type: 'application/json',
              // Disable "thinking" — adds huge latency without improving spine reads.
              thinkingConfig: { thinkingBudget: 0 },
            },
            contents: [{ parts }],
          })
        });
      } catch (networkErr) {
        console.timeEnd('gemini');
        throw networkErr;
      }
      console.timeEnd('gemini');

      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`${res.status}: ${errText.slice(0, 200)}`);
      }

      const json  = await res.json();
      const raw   = json.candidates[0].content.parts[0].text;
      // With response_mime_type: 'application/json', we don't need markdown regex cleanup
      return JSON.parse(raw)
        .map(expandBook)
        .filter(b => {
          if (!b.bounding_box) return true;
          const [ymin, xmin, ymax, xmax] = b.bounding_box;
          // Ignore books that are cut off by touching the absolute edge of the image frame
          return xmin > 5 && xmax < 995 && ymin > 5 && ymax < 995;
        });
    }

    async function analyzeShelf() {
      analyzeBtn.disabled    = true;
      analyzeBtn.textContent = 'Analyzing…';
      showLoading();

      const tPrep0  = performance.now();
      const image   = getResizedImageData();
      const procTime = Math.round(performance.now() - tPrep0);
      const section = getSection();
      const prompt  = buildPrompt(section);
      let success = false;
      const maxAttempts = 2;

      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        if (attempt > 1) {
          analyzeBtn.textContent = `Retrying (Attempt ${attempt})…`;
        }
        try {
          const tApi0 = performance.now();
          const books = await callGemini(prompt, image);
          const apiTime = Math.round(performance.now() - tApi0);

          success = true;
          showResults(books, section);
          if (debugMode) showTimingBadge(procTime, apiTime, GEMINI_MODEL);
          break; // success, exit the retry loop
        } catch (err) {
          console.warn(`Attempt ${attempt} failed:`, err);
          if (attempt === maxAttempts || !navigator.onLine) {
            const offline = !navigator.onLine || /Failed to fetch|NetworkError/i.test(err.message);
            showErrorBanner(
              offline ? "Couldn't reach the server. Check your connection." : `Analysis failed: ${err.message}`,
              () => analyzeShelf()
            );
            analyzeBtn.disabled    = false;
            analyzeBtn.textContent = 'Analyze';
            break;
          }
          // otherwise loop continues to retry
        }
      }
      hideLoading(success);
    }

    // On-screen timing readout for Debug Mode: prep (CPU image pipeline) vs model
    // (network + inference) vs total. Tap to dismiss; auto-hides after 12s.
    function showTimingBadge(procTime, apiTime, model) {
      document.getElementById('timingBadge')?.remove();
      const fmt   = ms => (ms / 1000).toFixed(1) + 's';
      const total = procTime + apiTime;
      const badge = document.createElement('div');
      badge.id        = 'timingBadge';
      badge.className = 'timing-badge';
      badge.innerHTML =
        `⏱ prep <b>${fmt(procTime)}</b> · model <b>${fmt(apiTime)}</b> · total <b>${fmt(total)}</b>` +
        `<br><span style="color:#aaa">${escapeHtml(model)}</span>`;
      photoArea.appendChild(badge);
      badge.onclick = () => badge.remove();
      setTimeout(() => badge.remove(), 12000);
    }

    // Inline error banner with a Retry button — replaces blocking alert() popups.
    function showErrorBanner(message, onRetry) {
      document.getElementById('errorBanner')?.remove();
      const banner = document.createElement('div');
      banner.id = 'errorBanner';
      banner.className = 'error-banner';
      banner.innerHTML = `
        <span class="error-banner-msg">${escapeHtml(message)}</span>
        <button class="error-banner-retry" id="errBannerRetry">Retry</button>`;
      photoArea.appendChild(banner);
      document.getElementById('errBannerRetry').onclick = () => {
        banner.remove();
        onRetry();
      };
      // Auto-dismiss after 8s if ignored
      setTimeout(() => banner.remove(), 8000);
    }

    // ── Ordering logic ────────────────────────────────────

    // ── Common surname prefixes — these combine with the next word ──
    // "De La Cruz" → surname "delacruz", "Van Dyke" → "vandyke", etc.
    const SURNAME_PREFIXES = new Set([
      'de','del','dela','di','du','la','le','les','lo','mac','mc',
      'o','van','von','st','san','santa','el','al','bin','ibn','da','das','dos',
    ]);

    // Normalize an author field to just the surname, lowercased, letters-only.
    // Handles multi-word surnames: "De La Cruz" → "delacruz"
    // Handles "Cara Black", "Black, Cara", "BLACK", "Black Jr" → "black".
    function normalizeAuthor(s) {
      if (!s) return null;
      let v = String(s).toLowerCase().trim();
      if (v.includes(',')) v = v.split(',')[0].trim();   // "Last, First" → "Last"
      const parts = v.split(/\s+/).filter(Boolean);
      // Strip suffixes like Jr, Sr, III, II, IV
      while (parts.length > 1 && /^(jr|sr|ii|iii|iv|v|esq)\.?$/i.test(parts[parts.length - 1])) {
        parts.pop();
      }
      if (parts.length > 1) {
        // If this looks like "First Last" (no comma), take the last word
        // But handle multi-word surnames: "De La Cruz" → combine prefix words
        v = parts[parts.length - 1];
      } else if (parts.length === 1) {
        v = parts[0];
      }
      v = v.replace(/[^a-z]/g, '');
      return v || null;
    }

    // Reduce a string to its lowercase letters and numbers.
    function lettersLower(s) {
      return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    // Build a multi-word surname from a token list starting at index `start`.
    // "DE", "LA", "CRUZ" → "delacruz"; "BLACK" → "black".
    function buildMultiWordSurname(tokens, start) {
      let surname = '';
      let i = start;
      while (i < tokens.length - 1 && SURNAME_PREFIXES.has(tokens[i].toLowerCase())) {
        surname += tokens[i].toLowerCase();
        i++;
      }
      if (i < tokens.length) surname += tokens[i].toLowerCase();
      return surname.replace(/[^a-z]/g, '') || null;
    }

    // Parse an author-style label into { surname, first }. Handles the common formats:
    //   "BLACK"                          → { surname:'black', first:'' }
    //   "BLACK, Benjamin"                → { surname:'black', first:'benjamin' }
    //   "BLACK, Cara, Leduc 5"           → { surname:'black', first:'cara' }
    //   "Cara Black" / "Benjamin Black"  → { surname:'black', first:'cara'/'benjamin' }
    //   "BLACK Benjamin" (no comma)      → { surname:'black', first:'benjamin' }
    //   "DE LA CRUZ, Maria"              → { surname:'delacruz', first:'maria' }
    //   "Van Dyke, Dick"                 → { surname:'vandyke', first:'dick' }
    //   "Black Jr"                       → { surname:'black', first:'' }
    function parseSurnameAndFirst(s) {
      if (!s) return null;
      let str = String(s).trim();
      // Strip a trailing volume number (e.g. "Leduc 5" → "Leduc")
      str = str.replace(/\s*\d+\s*$/, '').trim();
      if (!str) return null;

      if (str.includes(',')) {
        const parts = str.split(',').map(p => p.trim()).filter(Boolean);
        // parts[0] is the surname portion (may be multi-word like "DE LA CRUZ")
        const surnameTokens = parts[0].split(/\s+/).filter(Boolean);
        const surname = buildMultiWordSurname(surnameTokens, 0) || lettersLower(parts[0]);
        const first   = parts[1] ? lettersLower(parts[1]) : '';
        if (!surname) return null;
        return { surname, first };
      }

      let tokens = str.split(/\s+/).filter(Boolean);
      if (tokens.length === 0) return null;
      // Strip suffixes like Jr, Sr, III, II
      while (tokens.length > 1 && /^(jr|sr|ii|iii|iv|v|esq)\.?$/i.test(tokens[tokens.length - 1])) {
        tokens.pop();
      }
      if (tokens.length === 1) {
        return { surname: lettersLower(tokens[0]), first: '' };
      }
      // No comma + multiple tokens.
      // Check for "SURNAME First" (library convention: first token ALL CAPS, second Mixed Case)
      const t0 = tokens[0], t1 = tokens[1];
      if (/^[A-Z]{2,}$/.test(t0) && /^[A-Z][a-z]/.test(t1)) {
        // Check if first tokens are prefix words: "DE LA CRUZ Maria"
        const surname = buildMultiWordSurname(tokens.slice(0, -1), 0) || lettersLower(t0);
        return { surname, first: lettersLower(tokens[tokens.length - 1]) };
      }
      // "First Last" or "First De La Cruz" — find where the surname starts
      // Walk from the end backward past any prefix words
      let surnameStart = tokens.length - 1;
      while (surnameStart > 1 && SURNAME_PREFIXES.has(tokens[surnameStart - 1].toLowerCase())) {
        surnameStart--;
      }
      const surname = buildMultiWordSurname(tokens, surnameStart);
      const first = lettersLower(tokens.slice(0, surnameStart).join(''));
      return { surname: surname || lettersLower(tokens[tokens.length - 1]), first };
    }

    // Parse a Dewey/cutter label like "973.7 HAR" or "KIN"
    function parseDewey(s) {
      if (!s) return null;
      const m = s.match(/^\s*([0-9]+(?:\.[0-9]+)?|[A-Za-z]+)\s*([A-Za-z]+)?/i);
      if (!m) return null;
      const num = isNaN(parseFloat(m[1])) ? null : parseFloat(m[1]);
      const cut = (m[2] || '').toLowerCase();
      return { num, cut, prefix: m[1].toLowerCase() };
    }

    // Pull a numeric series volume from either the explicit field or a parse of the label.
    function extractVolume(book) {
      if (typeof book.series_volume === 'number' && isFinite(book.series_volume)) {
        return book.series_volume;
      }
      // Fallback: look for a trailing number in spine_label like "Leduc 5" or "#3"
      if (book.spine_label) {
        const m = String(book.spine_label).match(/(\d+)\s*$/);
        if (m) return parseInt(m[1], 10);
      }
      return null;
    }

    // For an author-style spine label like "BLACK, Cara, Leduc 5" the normalized
    // primary key is just the author cutter — we drop the series name + volume so
    // that all books by the same author tie at the primary level. The volume is
    // returned separately as the secondary key.
    function normalizeLabelToAuthor(s) {
      if (!s) return null;
      const noVol = String(s).replace(/\s*\d+\s*$/, '');     // strip trailing volume
      const noSeries = noVol.replace(/,\s*[^,]+$/, '');       // strip trailing series name after second comma
      return normalizeAuthor(noSeries);
    }

    // ── Cross-field consistency check ──
    // When both spine_label and author_last are present, validate that the surname
    // from the label matches the standalone author_last field. If they disagree,
    // prefer the spine_label (it's the pre-printed sticker, more reliable) but
    // downgrade the book's effective confidence so the sandwich rule can catch
    // obvious OCR misreads.
    function reconcileAuthorFields(book) {
      if (!book.spine_label || !book.author_last) return book;
      const labelParsed = parseSurnameAndFirst(book.spine_label);
      if (!labelParsed) return book;

      const authorNorm = normalizeAuthor(book.author_last);
      if (!authorNorm) return book;

      // If the label surname matches the author_last, everything is consistent
      if (labelParsed.surname === authorNorm) return book;

      // Check if one is a prefix of the other (partial match like "black" vs "blackwell")
      const shorter = labelParsed.surname.length <= authorNorm.length ? labelParsed.surname : authorNorm;
      const longer  = labelParsed.surname.length >  authorNorm.length ? labelParsed.surname : authorNorm;
      if (longer.startsWith(shorter) && shorter.length >= 3) return book;

      // Genuine disagreement — label wins, but lower confidence
      // The spine_label is the pre-printed library sticker; author_last might be
      // Gemini reading the title text or a decorative font incorrectly.
      const newConf = book.confidence === 'high' ? 'medium' : 'low';
      return { ...book, confidence: newConf, _authorConflict: true };
    }

    // Build a comparable sort key for a book given the chosen section.
    // Returns null when there's no trustworthy signal (→ rendered yellow).
    // String keys carry surname (val), first name (first), and series volume (vol).
    // Comparison is surname → first name → volume (and a title fallback).
    function sortKey(book, section) {
      const lowConfNoLabel = book.confidence === 'low' && !book.spine_label;
      const vol = extractVolume(book);
      const title = lettersLower((book.title || '').replace(/^the\s+|^a\s+|^an\s+/i, ''));

      function strKeyFromAuthorish(s) {
        const a = parseSurnameAndFirst(s);
        return a ? { kind: 'str', val: a.surname, first: a.first, vol, title } : null;
      }

      if (section === 'fiction') {
        if (book.spine_label) {
          const k = strKeyFromAuthorish(book.spine_label);
          if (k) return k;
        }
        if (lowConfNoLabel) return null;
        return strKeyFromAuthorish(book.author_last);
      }

      if (section === 'nonfiction') {
        const d = parseDewey(book.spine_label) || parseDewey(book.call_number);
        return d ? { kind: 'dewey', val: d, vol, title } : null;
      }

      // unknown section → treat as fiction
      return strKeyFromAuthorish(book.author_last);
    }

    // Compare two sort keys. Returns <0, 0, >0.
    // Hierarchy (library filing order):
    //   1. kind (Dewey before author-string within a section)
    //   2. primary value (surname / Dewey number+cutter)
    //   3. first name (within same surname: Benjamin < Cara)
    //   4. series volume number (within same author: Leduc 5 < Leduc 6; nulls sort last)
    //   5. title (final tiebreaker for non-series books with same author)
    function compareKeys(a, b) {
      if (a.kind !== b.kind) return a.kind === 'dewey' ? -1 : 1;

      // 2. Primary value
      let cmp;
      if (a.kind === 'str') {
        cmp = a.val.localeCompare(b.val, undefined, { sensitivity: 'base' });
      } else {
        const A = a.val, B = b.val;
        // Strictly compare Dewey numbers. nulls sort to the beginning.
        const an = A.num === null ? -Infinity : A.num;
        const bn = B.num === null ? -Infinity : B.num;
        cmp = an !== bn ? an - bn : A.cut.localeCompare(B.cut, undefined, { sensitivity: 'base' });
      }
      if (cmp !== 0) return cmp;

      // 3. First name (string keys only; empty string sorts first)
      if (a.kind === 'str') {
        const af = a.first || '';
        const bf = b.first || '';
        cmp = af.localeCompare(bf, undefined, { sensitivity: 'base' });
        if (cmp !== 0) return cmp;
      }

      // 4. Series volume number (nulls sort last so unnumbered books come AFTER series)
      const av = a.vol == null ? Infinity : a.vol;
      const bv = b.vol == null ? Infinity : b.vol;
      if (av !== bv) return av - bv;

      // 5. Title (alphabetical, ignoring leading "the/a/an")
      const at = a.title || '';
      const bt = b.title || '';
      return at.localeCompare(bt, undefined, { sensitivity: 'base' });
    }

    // Longest non-decreasing subsequence of indices in `keys` (O(n²) DP, n is small).
    // Returns a Set of indices that are part of the LIS.
    function longestNonDecreasingSubseq(keys) {
      const n = keys.length;
      const dp   = new Array(n).fill(1);
      const prev = new Array(n).fill(-1);
      let bestEnd = 0;
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < i; j++) {
          if (compareKeys(keys[j], keys[i]) <= 0 && dp[j] + 1 > dp[i]) {
            dp[i]   = dp[j] + 1;
            prev[i] = j;
          }
        }
        if (dp[i] > dp[bestEnd]) bestEnd = i;
      }
      const set = new Set();
      for (let i = bestEnd; i !== -1; i = prev[i]) set.add(i);
      return set;
    }

    // Group books into shelf rows by Y-coordinate clustering.
    // Within each shelf, books are sorted left-to-right by X-center.
    // Returns { shelves: [[book, ...], ...], ungrouped: [book, ...] }.
    function groupByShelf(books) {
      const ungrouped = [];
      const boxed    = [];
      for (const b of books) {
        if (!b.bounding_box || b.bounding_box.length !== 4) ungrouped.push(b);
        else boxed.push(b);
      }
      if (boxed.length === 0) return { shelves: [], ungrouped };

      // Compute Y-center and height per book
      const enriched = boxed.map(b => {
        const [ymin, , ymax] = b.bounding_box;
        return { book: b, yc: (ymin + ymax) / 2, h: Math.max(1, ymax - ymin) };
      });

      // Sort by Y-center
      enriched.sort((a, b) => a.yc - b.yc);

      // Median spine height — threshold for starting a new shelf
      const heights = [...enriched.map(e => e.h)].sort((a, b) => a - b);
      const medianH = heights[Math.floor(heights.length / 2)] || 100;
      const gapThreshold = medianH * 0.6;

      // Walk and split into shelves
      const shelves = [[enriched[0]]];
      for (let i = 1; i < enriched.length; i++) {
        const gap = enriched[i].yc - enriched[i - 1].yc;
        if (gap > gapThreshold) shelves.push([]);
        shelves[shelves.length - 1].push(enriched[i]);
      }

      // Within each shelf, sort by X-center (left to right)
      const result = shelves.map(shelf => {
        shelf.sort((a, b) => {
          const ax = (a.book.bounding_box[1] + a.book.bounding_box[3]) / 2;
          const bx = (b.book.bounding_box[1] + b.book.bounding_box[3]) / 2;
          return ax - bx;
        });
        return shelf.map(e => e.book);
      });

      return { shelves: result, ungrouped };
    }

    // Clip box heights so they don't bleed across shelves.
    // For each shelf, compute median ymin/ymax; clamp outliers to that band.
    function clipShelfBoxes(shelfBooks) {
      if (shelfBooks.length < 2) return shelfBooks;
      const ymins = shelfBooks.map(b => b.bounding_box[0]).sort((a, b) => a - b);
      const ymaxs = shelfBooks.map(b => b.bounding_box[2]).sort((a, b) => a - b);
      const medYmin = ymins[Math.floor(ymins.length / 2)];
      const medYmax = ymaxs[Math.floor(ymaxs.length / 2)];
      const heights = shelfBooks.map(b => b.bounding_box[2] - b.bounding_box[0]).sort((a, b) => a - b);
      const medH = heights[Math.floor(heights.length / 2)];
      const tol = medH * 0.25;

      return shelfBooks.map(b => {
        const [ymin, xmin, ymax, xmax] = b.bounding_box;
        const clampedYmin = ymin < medYmin - tol ? medYmin : ymin;
        const clampedYmax = ymax > medYmax + tol ? medYmax : ymax;
        return { ...b, bounding_box: [clampedYmin, xmin, clampedYmax, xmax] };
      });
    }

    // Sanitize bounding boxes within a shelf: clamp oversized widths and resolve overlaps.
    // Books must already be sorted left-to-right by X-center.
    function sanitizeShelfBoxes(shelfBooks) {
      if (shelfBooks.length < 2) return shelfBooks;

      // Median width — used to cap outliers
      const widths = shelfBooks.map(b => b.bounding_box[3] - b.bounding_box[1]).sort((a, b) => a - b);
      const medW = widths[Math.floor(widths.length / 2)];
      const maxW = medW * 1.8;  // no box wider than 1.8× median

      const fixed = shelfBooks.map(b => {
        let [ymin, xmin, ymax, xmax] = b.bounding_box;
        const w = xmax - xmin;
        if (w > maxW) {
          // Shrink toward center
          const cx = (xmin + xmax) / 2;
          xmin = cx - maxW / 2;
          xmax = cx + maxW / 2;
        }
        return { ...b, bounding_box: [ymin, xmin, ymax, xmax] };
      });

      // Resolve horizontal overlaps: push adjacent boxes apart so arrows don't stack
      for (let i = 0; i < fixed.length - 1; i++) {
        const bbA = fixed[i].bounding_box;
        const bbB = fixed[i + 1].bounding_box;
        if (bbA[3] > bbB[1]) {
          // Overlap detected — split at midpoint
          const mid = (bbA[3] + bbB[1]) / 2;
          fixed[i]     = { ...fixed[i],     bounding_box: [bbA[0], bbA[1], bbA[2], mid] };
          fixed[i + 1] = { ...fixed[i + 1], bounding_box: [bbB[0], mid,    bbB[2], bbB[3]] };
        }
      }

      return fixed;
    }

    // Levenshtein edit distance between two strings (small inputs — simple DP).
    // Used to detect OCR near-twin surnames like "waldron" vs "waldman" (distance 2).
    function editDistance(a, b) {
      a = a || ''; b = b || '';
      const m = a.length, n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      let prev = Array.from({ length: n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++) {
        const cur = [i];
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        }
        prev = cur;
      }
      return prev[n];
    }

    // Check order for a single shelf of books (already sorted left→right within the shelf).
    function checkOrderOneShelf(books, section) {
      const keys = books.map(b => sortKey(b, section));
      const verifiableIdx = [];
      keys.forEach((k, i) => { if (k !== null) verifiableIdx.push(i); });

      const verifiableKeys = verifiableIdx.map(i => keys[i]);
      const lisLocal       = longestNonDecreasingSubseq(verifiableKeys);
      const lisGlobal      = new Set([...lisLocal].map(localIdx => verifiableIdx[localIdx]));

      // Ideal position = the slot (within this shelf) that the rank-th sorted book occupies.
      // Positions are 1-indexed WITHIN this shelf only.
      const sortedVerifiable = [...verifiableIdx].sort((a, b) => compareKeys(keys[a], keys[b]));
      const idealRank = new Map();
      sortedVerifiable.forEach((origIdx, rank) => {
        idealRank.set(origIdx, verifiableIdx[rank] + 1);
      });

      // Compute tied-group slot ranges: for each book, the inclusive [min,max] slot range
      // of all verifiable books that tie with it. If a book's current shelf position falls
      // inside its tied range, it's not really "out of order" even if the LIS excluded it.
      const tiedGroupSlots = new Map();
      let r = 0;
      while (r < sortedVerifiable.length) {
        let s = r;
        while (
          s + 1 < sortedVerifiable.length &&
          compareKeys(keys[sortedVerifiable[s + 1]], keys[sortedVerifiable[r]]) === 0
        ) s++;
        // Slot range = [verifiableIdx[r]+1, verifiableIdx[s]+1]
        const lo = verifiableIdx[r] + 1;
        const hi = verifiableIdx[s] + 1;
        for (let k = r; k <= s; k++) {
          tiedGroupSlots.set(sortedVerifiable[k], [lo, hi]);
        }
        r = s + 1;
      }

      const checked = books.map((book, i) => {
        // Shelf-relative position is i+1
        const shelfPos = i + 1;
        if (keys[i] === null) {
          return {
            ...book, outOfOrder: false, unverifiable: true,
            idealPosition: null, shelfPosition: shelfPos,
            shelfSize: books.length, tiedGroupSlots: null,
          };
        }
        const ideal = idealRank.get(i) ?? null;
        const tied  = tiedGroupSlots.get(i) || null;
        // If position falls inside its tied group's slot range, treat as in-order
        const inTiedRange = tied && shelfPos >= tied[0] && shelfPos <= tied[1];
        const inLis = lisGlobal.has(i);
        const outOfOrder = !inLis && !inTiedRange;
        return {
          ...book,
          outOfOrder,
          unverifiable: false,
          idealPosition: ideal,
          shelfPosition: shelfPos,
          shelfSize: books.length,
          tiedGroupSlots: tied,
        };
      });

      // Sandwich rule: a red book surrounded by greens whose keys MATCH or are CLOSE
      // is almost certainly an OCR misread, not a real misplacement.
      // Rule 1: Exact match — nearest non-red neighbors have IDENTICAL keys.
      // Rule 2: Outlier — both neighbors' primary value (surname / dewey) are within
      //         1 letter of each other but the flagged book's primary value is far away.
      //         "far" = the first letter differs by ≥3 positions in the alphabet.
      for (let i = 0; i < checked.length; i++) {
        if (!checked[i].outOfOrder) continue;
        let L = i - 1;
        while (L >= 0 && checked[L].outOfOrder) L--;
        let R = i + 1;
        while (R < checked.length && checked[R].outOfOrder) R++;
        if (L < 0 || R >= checked.length) continue;
        const kL = keys[L], kR = keys[R], kM = keys[i];
        if (!kL || !kR || !kM) continue;

        let demote = false;

        // Rule 1: exact match between neighbors
        if (compareKeys(kL, kR) === 0) {
          demote = true;
        }

        // Rule 2: neighbors close to each other, flagged book far from both
        if (!demote && kL.kind === kR.kind && kM.kind === kL.kind) {
          const valL = kL.kind === 'str' ? kL.val : String(kL.val.num ?? '');
          const valR = kR.kind === 'str' ? kR.val : String(kR.val.num ?? '');
          const valM = kM.kind === 'str' ? kM.val : String(kM.val.num ?? '');
          if (valL && valR && valM) {
            const neighborsClose = valL.charAt(0) === valR.charAt(0);
            const farFromL = Math.abs(valM.charCodeAt(0) - valL.charCodeAt(0)) >= 3;
            const farFromR = Math.abs(valM.charCodeAt(0) - valR.charCodeAt(0)) >= 3;
            if (neighborsClose && farFromL && farFromR) {
              demote = true;
            }
          }
        }

        // Rule 3: OCR near-twin. The flagged surname is a near-match (edit distance ≤2)
        // of an adjacent verifiable surname — e.g. "waldron" vs "waldman". This is far
        // more likely a misread than a genuine misplacement, so demote to unverifiable.
        // Restricted to surnames ≥5 chars so short names ("kane"/"lane") don't false-trigger.
        if (!demote && kM.kind === 'str') {
          const valM = kM.val || '';
          for (const kN of [kL, kR]) {
            if (kN.kind !== 'str') continue;
            const valN = kN.val || '';
            if (Math.min(valM.length, valN.length) >= 5 &&
                valM !== valN &&
                editDistance(valM, valN) <= 2) {
              demote = true;
              break;
            }
          }
        }

        if (demote) {
          checked[i].outOfOrder    = false;
          checked[i].unverifiable  = true;
          checked[i].idealPosition = null;
        }
      }

      return checked;
    }

    // Public entry: group by shelf, clip boxes per shelf, run order check per shelf,
    // and flatten back to a single array (preserving each book's display position).
    function checkOrder(books, section) {
      const { shelves, ungrouped } = groupByShelf(books);
      const checkedShelves = shelves.flatMap((shelf, si) => {
        const clipped   = clipShelfBoxes(shelf);
        const sanitized = sanitizeShelfBoxes(clipped);
        // Tag each book with its shelf index so we can match shelf-mates later
        return checkOrderOneShelf(sanitized, section).map(b => ({ ...b, shelfIndex: si }));
      });
      // Ungrouped books (no bounding box) — pass through as unverifiable, no shelf info
      const checkedUngrouped = ungrouped.map(b => ({
        ...b, outOfOrder: false, unverifiable: true, idealPosition: null,
        shelfPosition: null, shelfSize: null, shelfIndex: -1, tiedGroupSlots: null,
      }));
      return [...checkedShelves, ...checkedUngrouped];
    }

    // Map a normalized (0-1000) bounding box to a pixel rect over photoArea,
    // accounting for the snapshot's object-fit:contain letterboxing.
    function bbToRect(bb) {
      const cw = snapshot.width, ch = snapshot.height;
      const rect   = snapshot.getBoundingClientRect();
      const paRect = photoArea.getBoundingClientRect();
      const s = Math.min(rect.width / cw, rect.height / ch);
      const offX = (rect.width  - cw * s) / 2 + (rect.left - paRect.left);
      const offY = (rect.height - ch * s) / 2 + (rect.top  - paRect.top);
      const [ymin, xmin, ymax, xmax] = bb;
      return {
        left:   offX + (xmin / 1000) * cw * s,
        top:    offY + (ymin / 1000) * ch * s,
        width:  ((xmax - xmin) / 1000) * cw * s,
        height: ((ymax - ymin) / 1000) * ch * s,
      };
    }

    // Mark only the white LABEL at the foot of each flagged spine (small + unobtrusive):
    // red = out of order, yellow = couldn't read. In-order books stay unmarked.
    function renderBoxes() {
      document.getElementById('bookBoxes')?.remove();
      const flagged = lastCheckedBooks.filter(b => b.bounding_box && (b.outOfOrder || b.unverifiable));
      if (flagged.length === 0) return;

      const wrap = document.createElement('div');
      wrap.id = 'bookBoxes';
      wrap.className = 'book-boxes';
      photoArea.appendChild(wrap);

      for (const b of flagged) {
        const r = bbToRect(b.bounding_box);
        // Label sits at the bottom of the spine — highlight just that strip.
        const labelH = Math.max(12, Math.min(r.height * 0.16, 30));
        const mark = document.createElement('div');
        mark.className = 'label-mark ' + (b.outOfOrder ? 'label-mark-bad' : 'label-mark-unv');
        mark.style.left   = `${r.left}px`;
        mark.style.top    = `${r.top + r.height - labelH}px`;
        mark.style.width  = `${r.width}px`;
        mark.style.height = `${labelH}px`;
        wrap.appendChild(mark);
      }
    }

    // ── Results: draw boxes + a summary badge ───────────────
    let lastCheckedBooks = [];

    function showResults(books, section) {
      const checked = checkOrder(books, section);
      lastCheckedBooks = checked;

      document.getElementById('resultsOverlay')?.remove();

      const total    = checked.length;
      const outCount = checked.filter(b => b.outOfOrder).length;
      const unvCount = checked.filter(b => b.unverifiable).length;

      actionBar.classList.remove('show');

      // No books detected — don't claim "all in order". Prompt a retake instead.
      if (total === 0) {
        showNoBooksBadge();
        return;
      }

      enableInspect();
      renderBoxes();
      showSummaryBadge(total, outCount, unvCount);
    }

    // Shown when Gemini detected zero books (blurry/dark/empty photo or a misfire).
    function showNoBooksBadge() {
      const overlay = document.createElement('div');
      overlay.id        = 'resultsOverlay';
      overlay.className = 'results-overlay';
      overlay.innerHTML = `
        <div class="overlay-badge badge-warn">No books detected — retake</div>
        <button class="btn-new-scan" onclick="newScan()">Retake</button>`;
      photoArea.appendChild(overlay);
    }

    // Bottom summary: red count of out-of-order books, else yellow count to check,
    // else all-clear green. Tap any box on the photo for that book's details.
    function showSummaryBadge(total, outCount, unvCount) {
      let badgeClass, badgeText;
      if (outCount > 0)       { badgeClass = 'badge-warn';         badgeText = `${outCount} out of order · ${total} read`; }
      else if (unvCount > 0)  { badgeClass = 'badge-unverifiable'; badgeText = `${unvCount} to check · ${total} read`; }
      else                    { badgeClass = 'badge-ok';           badgeText = `✓ All ${total} in order`; }

      const overlay = document.createElement('div');
      overlay.id        = 'resultsOverlay';
      overlay.className = 'results-overlay';
      overlay.innerHTML = `
        <div class="overlay-badge ${badgeClass}">${badgeText}</div>
        <button class="btn-new-scan" onclick="newScan()">New Scan</button>`;
      photoArea.appendChild(overlay);
    }

    // Reposition boxes if the viewport changes (rotation, etc).
    window.addEventListener('resize', () => {
      if (document.getElementById('bookBoxes')) renderBoxes();
    });

    // ── Tap-to-inspect: show OCR readout for the tapped book ──
    function enableInspect() {
      snapshot.style.pointerEvents = 'auto';
      snapshot.style.cursor = 'pointer';
      snapshot.addEventListener('click', inspectHandler);
    }

    function disableInspect() {
      snapshot.style.pointerEvents = '';
      snapshot.style.cursor = '';
      snapshot.removeEventListener('click', inspectHandler);
      document.getElementById('bookInspect')?.remove();
    }

    function inspectHandler(e) {
      // Translate click to canvas-internal coordinates (object-fit: contain)
      const rect = snapshot.getBoundingClientRect();
      const cw = snapshot.width, ch = snapshot.height;
      const dispScale = Math.min(rect.width / cw, rect.height / ch);
      const dispW = cw * dispScale, dispH = ch * dispScale;
      const offX = (rect.width  - dispW) / 2;
      const offY = (rect.height - dispH) / 2;
      const px = (e.clientX - rect.left - offX) / dispScale;
      const py = (e.clientY - rect.top  - offY) / dispScale;

      // Hit-test against book boxes (prefer smallest box if multiple contain the point)
      let best = null, bestArea = Infinity;
      for (const b of lastCheckedBooks) {
        if (!b.bounding_box) continue;
        const [ymin, xmin, ymax, xmax] = b.bounding_box;
        const x = (xmin / 1000) * cw;
        const y = (ymin / 1000) * ch;
        const w = ((xmax - xmin) / 1000) * cw;
        const h = ((ymax - ymin) / 1000) * ch;
        if (px >= x && px <= x + w && py >= y && py <= y + h) {
          const area = w * h;
          if (area < bestArea) { best = b; bestArea = area; }
        }
      }

      document.getElementById('bookInspect')?.remove();
      if (!best) return;

      const confColor = best.confidence === 'high' ? '#4ade80' : best.confidence === 'medium' ? '#facc15' : '#f87171';

      const status = best.unverifiable ? "⚠ Couldn't read this spine clearly — check it by hand."
                   : best.outOfOrder    ? '⚠ Out of order — this book is in the wrong spot.'
                   :                       '✓ In order';

      const card = document.createElement('div');
      card.id = 'bookInspect';
      card.className = 'book-inspect';
      card.innerHTML = `
        <div class="bi-row"><span class="bi-key">Title</span><span class="bi-val">${escapeHtml(best.title) || '—'}</span></div>
        <div class="bi-row"><span class="bi-key">Author</span><span class="bi-val">${escapeHtml(best.author_last) || '—'}${best._authorConflict ? ' <span style="color:#facc15;font-size:11px">(label mismatch)</span>' : ''}</span></div>
        <div class="bi-row"><span class="bi-key">Label</span><span class="bi-val">${escapeHtml(best.spine_label || best.call_number) || '—'}</span></div>
        ${best.series_volume != null ? `<div class="bi-row"><span class="bi-key">Volume</span><span class="bi-val">#${best.series_volume}</span></div>` : ''}
        <div class="bi-status">${status}</div>
        <button class="bi-close" aria-label="Close">×</button>`;
      photoArea.appendChild(card);
      card.querySelector('.bi-close').addEventListener('click', () => card.remove());
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function newScan() {
      document.getElementById('resultsOverlay')?.remove();
      document.getElementById('bookBoxes')?.remove();
      document.getElementById('debugOverlay')?.remove();
      document.getElementById('bookInspect')?.remove();
      disableInspect();
      retake();
    }

    // ── Debug mode ──────────────────────────────────────
    let debugMode = false;
    const settingsBtn    = document.getElementById('settingsBtn');
    const settingsMenu   = document.getElementById('settingsMenu');
    const debugToggle    = document.getElementById('debugToggle');
    const debugSwitch    = document.getElementById('debugToggleSwitch');

    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsMenu.classList.toggle('show');
    });
    document.addEventListener('click', () => settingsMenu.classList.remove('show'));
    settingsMenu.addEventListener('click', (e) => e.stopPropagation());

    debugToggle.addEventListener('click', () => {
      debugMode = !debugMode;
      debugSwitch.classList.toggle('on', debugMode);
      settingsBtn.classList.toggle('debug-active', debugMode);
      // Show/hide debug badge
      document.getElementById('debugBadge')?.remove();
      if (debugMode) {
        const badge = document.createElement('div');
        badge.id = 'debugBadge';
        badge.className = 'debug-badge';
        badge.textContent = 'DEBUG';
        document.querySelector('.header').appendChild(badge);
      }
      settingsMenu.classList.remove('show');
    });

    analyzeBtn.addEventListener('click', () => {

    // ── Test suite ──────────────────────────────────────
    // Run with runTests() in the browser console.
    // Tests cover: name parsing, sort keys, ordering logic, reconciliation.
    function runTests() {
      let pass = 0, fail = 0;
      function assert(cond, msg) {
        if (cond) { pass++; }
        else { fail++; console.error('FAIL:', msg); }
      }
      function eq(a, b, msg) { assert(a === b, `${msg}: expected "${b}", got "${a}"`); }
      function deepEq(a, b, msg) { assert(JSON.stringify(a) === JSON.stringify(b), `${msg}: expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

      // ── parseSurnameAndFirst ──
      console.group('parseSurnameAndFirst');

      deepEq(parseSurnameAndFirst('BLACK'), { surname: 'black', first: '' },
        'Single all-caps surname');

      deepEq(parseSurnameAndFirst('BLACK, Benjamin'), { surname: 'black', first: 'benjamin' },
        'Comma-separated Last, First');

      deepEq(parseSurnameAndFirst('BLACK, Cara, Leduc 5'), { surname: 'black', first: 'cara' },
        'Label with series — strips series, keeps surname and first');

      deepEq(parseSurnameAndFirst('Cara Black'), { surname: 'black', first: 'cara' },
        'First Last format');

      deepEq(parseSurnameAndFirst('BLACK Benjamin'), { surname: 'black', first: 'benjamin' },
        'ALL CAPS surname then Mixed Case first');

      // Multi-word surnames
      deepEq(parseSurnameAndFirst('DE LA CRUZ, Maria'), { surname: 'delacruz', first: 'maria' },
        'Multi-word surname with comma');

      deepEq(parseSurnameAndFirst('Maria De La Cruz'), { surname: 'delacruz', first: 'maria' },
        'Multi-word surname First-Last format');

      deepEq(parseSurnameAndFirst('VAN DYKE, Dick'), { surname: 'vandyke', first: 'dick' },
        'Van Dyke comma format');

      deepEq(parseSurnameAndFirst('Dick Van Dyke'), { surname: 'vandyke', first: 'dick' },
        'Van Dyke first-last format');

      // Suffixes
      deepEq(parseSurnameAndFirst('Black Jr'), { surname: 'black', first: '' },
        'Surname with Jr suffix — strips Jr');

      deepEq(parseSurnameAndFirst('Martin Luther King Jr'), { surname: 'king', first: 'martinluther' },
        'Full name with Jr suffix');

      deepEq(parseSurnameAndFirst(null), null, 'null input');
      deepEq(parseSurnameAndFirst(''), null, 'empty string');
      deepEq(parseSurnameAndFirst('   '), null, 'whitespace only');

      console.groupEnd();

      // ── normalizeAuthor ──
      console.group('normalizeAuthor');
      eq(normalizeAuthor('Cara Black'), 'black', 'First Last');
      eq(normalizeAuthor('Black, Cara'), 'black', 'Last, First');
      eq(normalizeAuthor('BLACK'), 'black', 'All caps');
      eq(normalizeAuthor('Black Jr'), 'black', 'With Jr suffix');
      eq(normalizeAuthor(null), null, 'null');
      eq(normalizeAuthor(''), null, 'empty');
      console.groupEnd();

      // ── parseDewey ──
      console.group('parseDewey');
      deepEq(parseDewey('973.7 HAR'), { num: 973.7, cut: 'har', prefix: '973.7' },
        'Standard Dewey with cutter');
      deepEq(parseDewey('KIN'), { num: null, cut: '', prefix: 'kin' },
        'Author cutter only');
      deepEq(parseDewey('813 PAT'), { num: 813, cut: 'pat', prefix: '813' },
        'Dewey integer with cutter');
      eq(parseDewey(null), null, 'null');
      eq(parseDewey(''), null, 'empty');
      console.groupEnd();

      // ── extractVolume ──
      console.group('extractVolume');
      eq(extractVolume({ series_volume: 5 }), 5, 'Explicit volume');
      eq(extractVolume({ spine_label: 'Leduc 5' }), 5, 'Volume from label');
      eq(extractVolume({ spine_label: 'BLACK' }), null, 'No volume');
      eq(extractVolume({}), null, 'Empty book');
      console.groupEnd();

      // ── reconcileAuthorFields ──
      console.group('reconcileAuthorFields');
      let book1 = { spine_label: 'BLACK, Cara', author_last: 'Black', confidence: 'high' };
      eq(reconcileAuthorFields(book1).confidence, 'high', 'Consistent fields — no change');

      let book2 = { spine_label: 'KING, Stephen', author_last: 'Patterson', confidence: 'high' };
      let rec2 = reconcileAuthorFields(book2);
      eq(rec2.confidence, 'medium', 'Conflicting fields — downgraded');
      eq(rec2._authorConflict, true, 'Conflict flag set');

      let book3 = { spine_label: 'BLACK, Cara', author_last: 'Blackwell', confidence: 'high' };
      eq(reconcileAuthorFields(book3).confidence, 'high', 'Prefix match — no downgrade');

      let book4 = { author_last: 'Black', confidence: 'high' };
      eq(reconcileAuthorFields(book4).confidence, 'high', 'No label — no change');
      console.groupEnd();

      // ── sortKey ──
      console.group('sortKey');
      let sk1 = sortKey({ spine_label: 'BLACK, Cara', author_last: 'Black', title: 'Murder' }, 'fiction');
      eq(sk1.kind, 'str', 'Fiction + label → str key');
      eq(sk1.val, 'black', 'Fiction label surname');
      eq(sk1.first, 'cara', 'Fiction label first name');

      let sk2 = sortKey({ author_last: 'Patterson', title: 'Max Ride' }, 'fiction');
      eq(sk2.val, 'patterson', 'Fiction fallback to author_last');

      let sk3 = sortKey({ spine_label: '973.7 HAR' }, 'nonfiction');
      eq(sk3.kind, 'dewey', 'Nonfiction Dewey key');
      eq(sk3.val.num, 973.7, 'Dewey number');

      let sk4 = sortKey({ confidence: 'low' }, 'fiction');
      eq(sk4, null, 'Low confidence no label → null (unverifiable)');

      let sk5 = sortKey({ spine_label: '813.54 PAT' }, 'auto');
      eq(sk5.kind, 'dewey', 'Auto mode Dewey detection');

      let sk6 = sortKey({ spine_label: 'KING' }, 'auto');
      eq(sk6.kind, 'str', 'Auto mode — non-Dewey label → str');
      eq(sk6.val, 'king', 'Auto mode author from label');
      console.groupEnd();

      // ── compareKeys ──
      console.group('compareKeys');
      let ka = { kind: 'str', val: 'black', first: 'benjamin', vol: null, title: '' };
      let kb = { kind: 'str', val: 'black', first: 'cara', vol: null, title: '' };
      assert(compareKeys(ka, kb) < 0, 'Same surname, benjamin < cara');

      let kc = { kind: 'str', val: 'black', first: 'cara', vol: 3, title: '' };
      let kd = { kind: 'str', val: 'black', first: 'cara', vol: 5, title: '' };
      assert(compareKeys(kc, kd) < 0, 'Same author, vol 3 < vol 5');

      let ke = { kind: 'str', val: 'black', first: 'cara', vol: null, title: 'alpha' };
      let kf = { kind: 'str', val: 'black', first: 'cara', vol: null, title: 'beta' };
      assert(compareKeys(ke, kf) < 0, 'Same author no vol, title alpha < beta');

      let kg = { kind: 'dewey', val: { num: 813, cut: 'pat', prefix: '813' }, vol: null, title: '' };
      let kh = { kind: 'dewey', val: { num: 973.7, cut: 'har', prefix: '973.7' }, vol: null, title: '' };
      assert(compareKeys(kg, kh) < 0, 'Dewey 813 < 973.7');

      assert(compareKeys({ kind: 'dewey', val: { num: 1, cut: '', prefix: '1' }, vol: null, title: '' },
                          { kind: 'str', val: 'a', first: '', vol: null, title: '' }) < 0,
        'Dewey before string in mixed sections');
      console.groupEnd();

      // ── checkOrder with simple shelf ──
      console.group('checkOrder (simple)');
      const simpleBooks = [
        { position: 1, author_last: 'Adams',  spine_label: 'ADAMS',  title: 'A', confidence: 'high', bounding_box: [100, 0, 900, 100] },
        { position: 2, author_last: 'Black',  spine_label: 'BLACK',  title: 'B', confidence: 'high', bounding_box: [100, 100, 900, 200] },
        { position: 3, author_last: 'Clark',  spine_label: 'CLARK',  title: 'C', confidence: 'high', bounding_box: [100, 200, 900, 300] },
      ];
      const simpleResult = checkOrder(simpleBooks, 'fiction');
      assert(simpleResult.every(b => !b.outOfOrder), 'All in order — no flags');
      assert(simpleResult.every(b => !b.unverifiable), 'All verifiable');
      console.groupEnd();

      // ── checkOrder with misplaced book ──
      console.group('checkOrder (misplaced)');
      const misplacedBooks = [
        { position: 1, author_last: 'Adams',  spine_label: 'ADAMS',  title: 'A', confidence: 'high', bounding_box: [100, 0, 900, 100] },
        { position: 2, author_last: 'Clark',  spine_label: 'CLARK',  title: 'C', confidence: 'high', bounding_box: [100, 100, 900, 200] },
        { position: 3, author_last: 'Black',  spine_label: 'BLACK',  title: 'B', confidence: 'high', bounding_box: [100, 200, 900, 300] },
      ];
      const misResult = checkOrder(misplacedBooks, 'fiction');
      assert(misResult[0].outOfOrder === false, 'Adams in order');
      assert(misResult[1].outOfOrder === false, 'Clark in LIS');
      assert(misResult[2].outOfOrder === true, 'Black flagged out of order');
      console.groupEnd();

      // ── checkOrder with unverifiable book ──
      console.group('checkOrder (unverifiable)');
      const unvBooks = [
        { position: 1, author_last: 'Adams',  spine_label: 'ADAMS',  title: 'A', confidence: 'high', bounding_box: [100, 0, 900, 100] },
        { position: 2, author_last: null,      spine_label: null,     title: null, confidence: 'low', bounding_box: [100, 100, 900, 200] },
        { position: 3, author_last: 'Clark',  spine_label: 'CLARK',  title: 'C', confidence: 'high', bounding_box: [100, 200, 900, 300] },
      ];
      const unvResult = checkOrder(unvBooks, 'fiction');
      assert(unvResult[1].unverifiable === true, 'Low confidence + no label → unverifiable');
      assert(unvResult[1].outOfOrder === false, 'Unverifiable not flagged as out-of-order');
      console.groupEnd();

      // ── checkOrder sandwich rule ──
      console.group('checkOrder (sandwich rule)');
      const sandwichBooks = [
        { position: 1, author_last: 'Black', spine_label: 'BLACK, Cara', title: 'A', confidence: 'high', bounding_box: [100, 0, 900, 100] },
        { position: 2, author_last: 'Zulu',  spine_label: 'ZULU',        title: 'Z', confidence: 'high', bounding_box: [100, 100, 900, 200] },
        { position: 3, author_last: 'Black', spine_label: 'BLACK, Cara', title: 'B', confidence: 'high', bounding_box: [100, 200, 900, 300] },
      ];
      const sandwichResult = checkOrder(sandwichBooks, 'fiction');
      assert(sandwichResult[1].unverifiable === true,
        'OCR outlier sandwiched between matching neighbors → demoted to unverifiable');
      assert(sandwichResult[1].outOfOrder === false,
        'Sandwiched book not flagged out-of-order');
      console.groupEnd();

      // ── Multi-shelf grouping ──
      console.group('groupByShelf');
      const multiShelfBooks = [
        { position: 1, bounding_box: [100, 0, 400, 100] },   // shelf 1
        { position: 2, bounding_box: [100, 100, 400, 200] },  // shelf 1
        { position: 3, bounding_box: [600, 0, 900, 100] },    // shelf 2
        { position: 4, bounding_box: [600, 100, 900, 200] },  // shelf 2
      ];
      const grouped = groupByShelf(multiShelfBooks);
      eq(grouped.shelves.length, 2, 'Two shelves detected');
      eq(grouped.shelves[0].length, 2, 'Shelf 1 has 2 books');
      eq(grouped.shelves[1].length, 2, 'Shelf 2 has 2 books');
      eq(grouped.ungrouped.length, 0, 'No ungrouped books');
      console.groupEnd();

      // ── Tied books ──
      console.group('checkOrder (tied keys)');
      const tiedBooks = [
        { position: 1, author_last: 'Black', spine_label: 'BLACK, Cara', title: 'A', confidence: 'high', bounding_box: [100, 0, 900, 100] },
        { position: 2, author_last: 'Black', spine_label: 'BLACK, Cara', title: 'B', confidence: 'high', bounding_box: [100, 100, 900, 200] },
        { position: 3, author_last: 'Black', spine_label: 'BLACK, Cara', title: 'C', confidence: 'high', bounding_box: [100, 200, 900, 300] },
      ];
      const tiedResult = checkOrder(tiedBooks, 'fiction');
      assert(tiedResult.every(b => !b.outOfOrder), 'Tied books — none flagged out of order');
      console.groupEnd();

      console.log(`\n=== Tests complete: ${pass} passed, ${fail} failed ===`);
      return { pass, fail };
    }

    // First-run hint / legend — shown once, explains framing + result colors.
    function maybeShowFirstHint() {
      let seen = false;
      try { seen = localStorage.getItem('shelfcheck.hintSeen') === '1'; } catch {}
      if (seen) return;

      const hint = document.createElement('div');
      hint.className = 'first-hint';
      hint.innerHTML = `
        <div class="first-hint-card">
          <h3>How ShelfCheck works</h3>
          <div class="first-hint-row">
            <span class="first-hint-dot" style="background:#3b82f6"></span>
            <span>Point at a shelf and tap the shutter. Pinch in for detail, or out for a wider view.</span>
          </div>
          <div class="first-hint-row">
            <span class="first-hint-dot" style="background:#ef4444"></span>
            <span><b>Red box</b> = out of order — move this book.</span>
          </div>
          <div class="first-hint-row">
            <span class="first-hint-dot" style="background:#facc15"></span>
            <span><b>Yellow box</b> = couldn't read the spine clearly — check it by eye.</span>
          </div>
          <div class="first-hint-row">
            <span class="first-hint-dot" style="background:#4ade80"></span>
            <span><b>No box</b> = in order. Tap any book to see what was read.</span>
          </div>
          <button class="first-hint-btn" id="firstHintBtn">Got it</button>
        </div>`;
      photoArea.appendChild(hint);
      document.getElementById('firstHintBtn').onclick = () => {
        hint.remove();
        try { localStorage.setItem('shelfcheck.hintSeen', '1'); } catch {}
      };
    }

    maybeShowFirstHint();
  </script>
