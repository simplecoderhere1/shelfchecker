<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ShelfCheck</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      height: 100vh;
      height: 100dvh;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ─────────────────────────────────────── */

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #1c1c1c;
      border-bottom: 1px solid #2c2c2c;
    }

    .app-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #e0e0e0;
    }

    .section-tabs {
      display: flex;
      background: #2c2c2c;
      border-radius: 8px;
      padding: 3px;
    }

    .tab-btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #888;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
      user-select: none;
    }

    .tab-btn.active {
      background: #f0f0f0;
      color: #111;
    }

    /* ── Camera area ─────────────────────────────────── */

    .camera-wrap {
      flex: 1;
      position: relative;
      background: #000;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .photo-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #snapshot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    /* Guide overlay */
    .guide {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guide-box {
      width: 94%;
      aspect-ratio: 3 / 4;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      position: relative;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.30);
    }

    .guide-box::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px;
      width: 18px; height: 18px;
      border-top: 2.5px solid rgba(255, 255, 255, 0.85);
      border-left: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 3px 0 0 0;
    }
    .guide-box::after {
      content: '';
      position: absolute;
      bottom: -2px; right: -2px;
      width: 18px; height: 18px;
      border-bottom: 2.5px solid rgba(255, 255, 255, 0.85);
      border-right: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 0 3px 0;
    }
    .guide-box > i {
      display: block;
      position: absolute;
      inset: 0;
    }
    .guide-box > i::before {
      content: '';
      position: absolute;
      top: -2px; right: -2px;
      width: 18px; height: 18px;
      border-top: 2.5px solid rgba(255, 255, 255, 0.85);
      border-right: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 3px 0 0;
    }
    .guide-box > i::after {
      content: '';
      position: absolute;
      bottom: -2px; left: -2px;
      width: 18px; height: 18px;
      border-bottom: 2.5px solid rgba(255, 255, 255, 0.85);
      border-left: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 0 0 3px;
    }

    .guide-label {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    /* Camera error state */
    .cam-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px;
      text-align: center;
      color: #666;
      z-index: 20;
    }
    .cam-error.show { display: flex; }
    .cam-error p { font-size: 14px; line-height: 1.65; max-width: 260px; }

    /* Zoom indicator */
    .zoom-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    /* Capture flash */
    @keyframes flash {
      0%   { opacity: 0.7; }
      100% { opacity: 0; }
    }
    .capture-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      pointer-events: none;
      z-index: 18;
      animation: flash 0.25s ease-out forwards;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 32px;
    }
    .loading-text {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .loading-bar {
      width: 100%;
      max-width: 260px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: #2563eb;
      border-radius: 999px;
      transition: width 0.12s linear;
    }
    .loading-pct {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Results overlay */
    .results-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 20px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .overlay-badge {
      font-size: 14px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
    }
    .badge-ok           { background: #14532d; color: #4ade80; }
    .badge-warn         { background: #450a0a; color: #f87171; }
    .badge-unverifiable { background: #713f12; color: #fde047; }

    .btn-new-scan {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    /* ── Step-through UI ────────────────────────────────── */
    .step-arrow {
      position: absolute;
      z-index: 22;
      pointer-events: none;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: left 0.28s ease, top 0.28s ease;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .step-arrow-num {
      background: #ef4444;
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      padding: 6px 14px;
      border-radius: 18px;
      min-width: 28px;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .step-arrow-tip {
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 16px solid #ef4444;
      margin-top: -1px;
    }
    .step-arrow.step-arrow-unv .step-arrow-num {
      background: #facc15;
      color: #1a1a1a;
    }
    .step-arrow.step-arrow-unv .step-arrow-tip {
      border-top-color: #facc15;
    }

    /* Persistent yellow "?" markers for unverifiable books — always visible */
    .unv-markers-wrap {
      position: absolute;
      inset: 0;
      z-index: 21;
      pointer-events: none;
    }
    .unv-marker {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45));
    }
    .unv-marker-pill {
      background: #facc15;
      color: #1a1a1a;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 9px;
      border-radius: 12px;
      line-height: 1.1;
    }
    .unv-marker-tip {
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 10px solid #facc15;
      margin-top: -1px;
    }

    /* Destination arrow — green, shown below source arrow when "place before X" */
    .step-arrow-dest {
      position: absolute;
      z-index: 22;
      pointer-events: none;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: left 0.28s ease, top 0.28s ease;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5));
    }
    .step-arrow-dest-pill {
      background: #16a34a;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 18px;
      text-align: center;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .step-arrow-dest-tip {
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 13px solid #16a34a;
      margin-top: -1px;
    }

    .step-card {
      position: relative;   /* in normal flow — stacks below photo area */
      flex-shrink: 0;
      z-index: 22;
      background: rgba(20, 20, 20, 0.97);
      backdrop-filter: blur(8px);
      border-top: 1px solid #2c2c2c;
      padding: 14px 16px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      color: #eee;
    }
    .step-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #888;
    }
    .step-summary { color: #f87171; }
    .step-counter { color: #888; font-variant-numeric: tabular-nums; }
    .step-title {
      font-size: 17px;
      font-weight: 700;
      margin-top: 4px;
      color: #fff;
      line-height: 1.25;
    }
    .step-meta {
      font-size: 13px;
      color: #aaa;
      margin-top: 2px;
    }
    .step-action {
      margin-top: 10px;
      padding: 11px 12px;
      background: #1e3a8a;
      color: #dbeafe;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.4;
      text-align: center;
    }
    .step-action b { color: #fff; }
    .step-nav {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .step-btn {
      flex: 1;
      padding: 11px 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #333;
      background: #2c2c2c;
      color: #ddd;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .step-btn:active { transform: scale(0.97); }
    .step-btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
      flex: 1.2;
    }

    /* Tap-to-inspect popup */
    .book-inspect {
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      z-index: 30;
      width: min(86%, 320px);
      background: rgba(20, 20, 20, 0.96);
      backdrop-filter: blur(6px);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px 16px 12px;
      font-size: 13px;
      color: #eee;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .bi-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
    .bi-key {
      color: #888;
      flex-shrink: 0;
    }
    .bi-val {
      color: #eee;
      text-align: right;
      word-break: break-word;
    }
    .bi-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .bi-status {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2c2c2c;
      font-weight: 600;
      color: #cbd5e1;
      text-align: center;
    }
    .bi-move {
      margin-top: 8px;
      padding: 10px 12px;
      background: #1e3a8a;
      border-radius: 8px;
      color: #dbeafe;
      font-size: 12.5px;
      line-height: 1.45;
      text-align: center;
    }
    .bi-move b { color: #fff; }
    .bi-close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* ── Footer ──────────────────────────────────────── */

    .footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: #1c1c1c;
      border-top: 1px solid #2c2c2c;
      min-height: 88px;
    }

    .capture-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background 0.1s ease;
    }
    .capture-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.22);
    }
    .capture-btn-dot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
    }

    .action-btns {
      display: none;
      gap: 12px;
    }
    .action-btns.show { display: flex; }

    .btn {
      padding: 13px 26px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.96); }

    .btn-retake {
      background: #2e2e2e;
      color: #ddd;
    }

    .btn-analyze {
      background: #2563eb;
      color: #fff;
    }
    .btn-analyze:disabled {
      background: #1a2f5e;
      color: #4e71b5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <span class="app-name">ShelfCheck</span>
    <div class="section-tabs" role="group" aria-label="Collection section">
      <button class="tab-btn active" data-section="auto">Auto</button>
      <button class="tab-btn"        data-section="fiction">Fiction</button>
      <button class="tab-btn"        data-section="nonfiction">Nonfiction</button>
    </div>
  </header>

  <div class="camera-wrap" id="cameraWrap">
    <!-- photo-area is the containing block for video/canvas and all their absolute overlays -->
    <div class="photo-area" id="photoArea">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="snapshot"></canvas>
      <div class="zoom-indicator" id="zoomIndicator"></div>
      <div class="guide" id="guide">
        <div class="guide-box">
          <i></i>
          <span class="guide-label">Frame the shelf here</span>
        </div>
      </div>

      <div class="cam-error" id="camError">
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        <p>Camera access is required.<br>Please allow permissions and reload.</p>
      </div>
    </div>
    <!-- step-through, loading overlay, results overlay, book-inspect appended here by JS -->
  </div>

  <footer class="footer">
    <button class="capture-btn" id="captureBtn" aria-label="Capture photo">
      <div class="capture-btn-dot"></div>
    </button>
    <div class="action-btns" id="actionBtns">
      <button class="btn btn-retake"  id="retakeBtn">Retake</button>
      <button class="btn btn-analyze" id="analyzeBtn" disabled>Analyze</button>
    </div>
  </footer>

  <script>
    const video         = document.getElementById('video');
    const snapshot      = document.getElementById('snapshot');
    const captureBtn    = document.getElementById('captureBtn');
    const actionBtns    = document.getElementById('actionBtns');
    const retakeBtn     = document.getElementById('retakeBtn');
    const analyzeBtn    = document.getElementById('analyzeBtn');
    const guide         = document.getElementById('guide');
    const camError      = document.getElementById('camError');
    const cameraWrap    = document.getElementById('cameraWrap');
    const photoArea     = document.getElementById('photoArea');
    const zoomIndicator = document.getElementById('zoomIndicator');
    // Section toggle
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ── Camera + zoom setup ───────────────────────────────
    let videoTrack = null;
    let zoomCaps   = null;
    let currentZoom = 1;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width:  { ideal: 3840 },
            height: { ideal: 2160 },
          },
          audio: false,
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        const caps = videoTrack.getCapabilities?.() || {};
        if (caps.zoom) {
          zoomCaps    = caps.zoom;
          currentZoom = caps.zoom.min || 1;
        }
      } catch {
        video.style.display = 'none';
        guide.style.display = 'none';
        camError.classList.add('show');
        captureBtn.disabled      = true;
        captureBtn.style.opacity = '0.35';
      }
    }

    // ── Pinch to zoom ─────────────────────────────────────
    let lastPinchDist = null;
    let zoomHideTimer = null;

    function getPinchDist(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function showZoom(zoom) {
      zoomIndicator.textContent = zoom.toFixed(1) + '×';
      zoomIndicator.style.opacity = '1';
      clearTimeout(zoomHideTimer);
      zoomHideTimer = setTimeout(() => zoomIndicator.style.opacity = '0', 1500);
    }

    function applyZoom(newZoom) {
      if (!zoomCaps || !videoTrack) return;
      currentZoom = Math.min(zoomCaps.max, Math.max(zoomCaps.min, newZoom));
      videoTrack.applyConstraints({ advanced: [{ zoom: currentZoom }] }).catch(() => {});
      showZoom(currentZoom);
    }

    cameraWrap.addEventListener('touchstart', e => {
      if (e.touches.length === 2) lastPinchDist = getPinchDist(e.touches);
    }, { passive: true });

    cameraWrap.addEventListener('touchmove', e => {
      if (e.touches.length !== 2 || lastPinchDist === null) return;
      const dist  = getPinchDist(e.touches);
      const delta = dist / lastPinchDist;
      lastPinchDist = dist;

      if (zoomCaps && videoTrack) {
        applyZoom(currentZoom * delta);
      }
    }, { passive: true });

    cameraWrap.addEventListener('touchend', e => {
      if (e.touches.length < 2) lastPinchDist = null;
    }, { passive: true });

    // ── Capture: crop to guide box ───────────────────────
    function capture() {
      const cw  = photoArea.clientWidth;
      const ch  = photoArea.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      const vw  = video.videoWidth  || cw;
      const vh  = video.videoHeight || ch;

      // Guide box dimensions in screen coords (matches CSS: width 94%, aspect 3:4)
      const gwScreen = cw * 0.94;
      const ghScreen = gwScreen * 4 / 3;
      const gxScreen = cw * 0.03;
      const gyScreen = (ch - ghScreen) / 2;

      // Video is displayed with object-fit:cover — map screen back to video coords
      const scale     = Math.max(cw / vw, ch / vh);
      const offsetX   = (cw - vw * scale) / 2;
      const offsetY   = (ch - vh * scale) / 2;
      const gxVideo   = (gxScreen - offsetX) / scale;
      const gyVideo   = (gyScreen - offsetY) / scale;
      const gwVideo   = gwScreen / scale;
      const ghVideo   = ghScreen / scale;

      // Canvas at display-pixel resolution, matching guide aspect ratio
      snapshot.width  = Math.round(gwScreen * dpr);
      snapshot.height = Math.round(ghScreen * dpr);

      snapshot.getContext('2d').drawImage(
        video,
        gxVideo, gyVideo, gwVideo, ghVideo,
        0, 0, snapshot.width, snapshot.height
      );

      // Flash animation
      const flash = document.createElement('div');
      flash.className = 'capture-flash';
      photoArea.appendChild(flash);
      flash.addEventListener('animationend', () => flash.remove());

      snapshot.style.display   = 'block';
      guide.style.display      = 'none';
      captureBtn.style.display = 'none';
      actionBtns.classList.add('show');
      analyzeBtn.disabled = false;
    }

    // ── Retake ────────────────────────────────────────────
    function retake() {
      snapshot.style.display   = 'none';
      video.style.display      = '';
      guide.style.display      = '';
      captureBtn.style.display = '';
      captureBtn.disabled      = false;
      actionBtns.classList.remove('show');

    function buildPrompt(section) {
      const sectionInstruction =
        section === 'auto'
          ? 'Section type: AUTO. Detect for each book whether it is fiction (sort key = author last name) or nonfiction (sort key = Dewey/call number). Read every field you can.'

For each spine, return:
- position: 1-indexed reading order
- title: as printed on the spine, or null if unreadable

- spine_label: the FULL text printed on the white library sticker at the BOTTOM of the spine. Include the cutter/author code AND the series name and volume number if visible. Examples: "KIN", "973.7 HAR", "BLACK, Cara, Leduc 5", "PATTERSON, Maximum Ride 3". If no sticker is visible, return null.
- series_volume: if the spine or label shows a numbered series volume (e.g. "Leduc 5", "Book 3", "Vol. 7", "#2"), return the volume as an INTEGER. Otherwise null. In a series, libraries sort by volume number, NOT by title.

READING TIPS for accuracy:

CRITICAL bounding box rules:

    // Enhance image: contrast/saturation/brightness (GPU filter) + 3×3 sharpening
    function preprocessImage(srcCanvas) {
      const W = srcCanvas.width;
      const H = srcCanvas.height;
      const dst = document.createElement('canvas');
      dst.width  = W;
      dst.height = H;
      const ctx = dst.getContext('2d');

      // GPU-accelerated CSS filters
      ctx.filter = 'contrast(1.25) saturate(1.15) brightness(1.05)';
      ctx.drawImage(srcCanvas, 0, 0);
      ctx.filter = 'none';

      // Mild 3×3 sharpening convolution: [0,-1,0, -1,5,-1, 0,-1,0]
      const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];
      const id  = ctx.getImageData(0, 0, W, H);
      const src = new Uint8ClampedArray(id.data);
      const out = id.data;

      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          for (let c = 0; c < 3; c++) {
            let v = 0;
            for (let ky = -1; ky <= 1; ky++) {
              for (let kx = -1; kx <= 1; kx++) {
                v += src[((y + ky) * W + (x + kx)) * 4 + c] * kernel[(ky + 1) * 3 + (kx + 1)];
              }
            }
            out[(y * W + x) * 4 + c] = Math.max(0, Math.min(255, v));
          }
        }
      }
      ctx.putImageData(id, 0, 0);
      return dst;
    }

    // Resize snapshot to max 1920px on long side, JPEG quality 0.82, then enhance.
    // Higher resolution gives Gemini more detail per spine, especially important
    // when photographing a full column of multiple shelves at once.
    function getResizedImageData(maxDim = 1920, quality = 0.92) {
      const W = snapshot.width;
      const H = snapshot.height;
      const scale = Math.min(1, maxDim / Math.max(W, H));

      const tmp  = document.createElement('canvas');
      tmp.width  = Math.round(W * scale);
      tmp.height = Math.round(H * scale);
      tmp.getContext('2d').drawImage(snapshot, 0, 0, tmp.width, tmp.height);

      const enhanced = preprocessImage(tmp);
      return enhanced.toDataURL('image/jpeg', quality).split(',')[1];
    }

    let loadingTimer = null;

    function showLoading() {
      const overlay = document.createElement('div');
      overlay.id        = 'loadingOverlay';
      overlay.className = 'loading-overlay';
      overlay.innerHTML = `
        <div class="loading-text">READING SPINES…</div>
        <div class="loading-bar"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
        <div class="loading-pct" id="loadingPct">0%</div>`;
      photoArea.appendChild(overlay);

      // Simulate progress: ease toward 85% over ~5s, then crawl toward 95%
      const fill = document.getElementById('loadingBarFill');
      const pct  = document.getElementById('loadingPct');
      const start = performance.now();
      const EASE_DURATION = 5000;  // reach 85% in 5s

        const t = (performance.now() - start) / EASE_DURATION;
        let p;
        if (t < 1) {
          p = 85 * (1 - Math.pow(1 - t, 2));  // ease-out to 85
        } else {
          p = Math.min(95, 85 + (t - 1) * 2);  // crawl 85→95
        }
        fill.style.width = p + '%';
        pct.textContent  = Math.round(p) + '%';
      }, 100);
    }

    function hideLoading(success = true) {

      const fill = document.getElementById('loadingBarFill');
      const pct  = document.getElementById('loadingPct');

        setTimeout(() => document.getElementById('loadingOverlay')?.remove(), 200);
      } else {

      }
    }

    // ── Ordering logic ────────────────────────────────────

    // Normalize an author field to just the surname, lowercased, letters-only.
    // Handles "Cara Black", "Black, Cara", "BLACK", "Black Benjamin" → "black".
    function normalizeAuthor(s) {
      if (!s) return null;
      let v = String(s).toLowerCase().trim();
      if (v.includes(',')) v = v.split(',')[0].trim();   // "Last, First" → "Last"
      const parts = v.split(/\s+/).filter(Boolean);
      if (parts.length > 1) v = parts[parts.length - 1]; // "Cara Black" → "Black"
      v = v.replace(/[^a-z]/g, '');
      return v || null;
    }

    // Reduce a string to its lowercase letters only.
    function lettersLower(s) {
      return String(s || '').toLowerCase().replace(/[^a-z]/g, '');
    }

    // Parse an author-style label into { surname, first }. Handles the common formats:
    //   "BLACK"                          → { surname:'black', first:'' }
    //   "BLACK, Benjamin"                → { surname:'black', first:'benjamin' }
    //   "BLACK, Cara, Leduc 5"           → { surname:'black', first:'cara' }
    //   "Cara Black" / "Benjamin Black"  → { surname:'black', first:'cara'/'benjamin' }
    //   "BLACK Benjamin" (no comma)      → { surname:'black', first:'benjamin' }
    function parseSurnameAndFirst(s) {
      if (!s) return null;
      let str = String(s).trim();
      // Strip a trailing volume number (e.g. "Leduc 5" → "Leduc")
      str = str.replace(/\s*\d+\s*$/, '').trim();
      if (!str) return null;

      if (str.includes(',')) {
        const parts = str.split(',').map(p => p.trim()).filter(Boolean);
        const surname = lettersLower(parts[0]);
        const first   = parts[1] ? lettersLower(parts[1]) : '';
        if (!surname) return null;
        return { surname, first };
      }

      const tokens = str.split(/\s+/).filter(Boolean);
      if (tokens.length === 0) return null;
      if (tokens.length === 1) {
        return { surname: lettersLower(tokens[0]), first: '' };
      }
      // No comma + multiple tokens. Heuristic: if the first token is ALL CAPS and
      // the second is Mixed Case, treat as "SURNAME First" (library convention).
      // Otherwise assume "First Last".
      const t0 = tokens[0], t1 = tokens[1];
      if (/^[A-Z]{2,}$/.test(t0) && /^[A-Z][a-z]/.test(t1)) {
        return { surname: lettersLower(t0), first: lettersLower(t1) };
      }
      return {
        surname: lettersLower(tokens[tokens.length - 1]),
        first:   lettersLower(tokens.slice(0, -1).join('')),
      };
    }

    // Parse a Dewey/cutter label like "973.7 HAR" or "KIN"
    function parseDewey(s) {
      if (!s) return null;
      const m = s.match(/^\s*([0-9]+(?:\.[0-9]+)?|[A-Za-z]+)\s*([A-Za-z]+)?/i);
      if (!m) return null;
      const num = isNaN(parseFloat(m[1])) ? null : parseFloat(m[1]);
      const cut = (m[2] || '').toLowerCase();
      return { num, cut, prefix: m[1].toLowerCase() };
    }

    // Pull a numeric series volume from either the explicit field or a parse of the label.
    function extractVolume(book) {
      if (typeof book.series_volume === 'number' && isFinite(book.series_volume)) {
        return book.series_volume;
      }
      // Fallback: look for a trailing number in spine_label like "Leduc 5" or "#3"
      if (book.spine_label) {
        const m = String(book.spine_label).match(/(\d+)\s*$/);
        if (m) return parseInt(m[1], 10);
      }
      return null;
    }

    // For an author-style spine label like "BLACK, Cara, Leduc 5" the normalized
    // primary key is just the author cutter — we drop the series name + volume so
    // that all books by the same author tie at the primary level. The volume is
    // returned separately as the secondary key.
    function normalizeLabelToAuthor(s) {
      if (!s) return null;
      const noVol = String(s).replace(/\s*\d+\s*$/, '');     // strip trailing volume
      const noSeries = noVol.replace(/,\s*[^,]+$/, '');       // strip trailing series name after second comma
      return normalizeAuthor(noSeries);
    }

    // Build a comparable sort key for a book given the chosen section.
    // Returns null when there's no trustworthy signal (→ rendered yellow).
    // String keys carry surname (val), first name (first), and series volume (vol).
    // Comparison is surname → first name → volume (and a title fallback).
    function sortKey(book, section) {
      const lowConfNoLabel = book.confidence === 'low' && !book.spine_label;
      const vol = extractVolume(book);
      const title = lettersLower((book.title || '').replace(/^the\s+|^a\s+|^an\s+/i, ''));

      function strKeyFromAuthorish(s) {
        const a = parseSurnameAndFirst(s);
        return a ? { kind: 'str', val: a.surname, first: a.first, vol, title } : null;
      }

      if (section === 'fiction') {
        if (book.spine_label) {
          const k = strKeyFromAuthorish(book.spine_label);
          if (k) return k;
        }
        if (lowConfNoLabel) return null;
        return strKeyFromAuthorish(book.author_last);
      }

      if (section === 'nonfiction') {
        const d = parseDewey(book.spine_label) || parseDewey(book.call_number);
        return d ? { kind: 'dewey', val: d, vol, title } : null;
      }

      // auto: spine_label > Dewey-shaped call_number > author_last
      if (book.spine_label) {
        const d = parseDewey(book.spine_label);
        if (d && d.num !== null) return { kind: 'dewey', val: d, vol, title };
        const k = strKeyFromAuthorish(book.spine_label);
        if (k) return k;
      }
      if (book.call_number && /^\s*\d/.test(book.call_number)) {
        const d = parseDewey(book.call_number);
        if (d) return { kind: 'dewey', val: d, vol, title };
      }
      if (lowConfNoLabel) return null;
      return strKeyFromAuthorish(book.author_last);
    }

    // Compare two sort keys. Returns <0, 0, >0.
    // Hierarchy (library filing order):
    //   1. kind (Dewey before author-string within a section)
    //   2. primary value (surname / Dewey number+cutter)
    //   3. first name (within same surname: Benjamin < Cara)
    //   4. series volume number (within same author: Leduc 5 < Leduc 6; nulls sort last)
    //   5. title (final tiebreaker for non-series books with same author)
    function compareKeys(a, b) {
      if (a.kind !== b.kind) return a.kind === 'dewey' ? -1 : 1;

      // 2. Primary value
      let cmp;
      if (a.kind === 'str') {
        cmp = a.val.localeCompare(b.val, undefined, { sensitivity: 'base' });
      } else {
        const A = a.val, B = b.val;
        const an = A.num === null ? -Infinity : A.num;
        const bn = B.num === null ? -Infinity : B.num;
        cmp = an !== bn ? an - bn : A.cut.localeCompare(B.cut, undefined, { sensitivity: 'base' });
      }
      if (cmp !== 0) return cmp;

      // 3. First name (string keys only; empty string sorts first)
      if (a.kind === 'str') {
        const af = a.first || '';
        const bf = b.first || '';
        cmp = af.localeCompare(bf, undefined, { sensitivity: 'base' });
        if (cmp !== 0) return cmp;
      }

      // 4. Series volume number (nulls sort last so unnumbered books come AFTER series)
      const av = a.vol == null ? Infinity : a.vol;
      const bv = b.vol == null ? Infinity : b.vol;
      if (av !== bv) return av - bv;

      // 5. Title (alphabetical, ignoring leading "the/a/an")
      const at = a.title || '';
      const bt = b.title || '';
      return at.localeCompare(bt, undefined, { sensitivity: 'base' });
    }

    // Longest non-decreasing subsequence of indices in `keys` (O(n²) DP, n is small).
    // Returns a Set of indices that are part of the LIS.
    function longestNonDecreasingSubseq(keys) {
      const n = keys.length;
      const dp   = new Array(n).fill(1);
      const prev = new Array(n).fill(-1);
      let bestEnd = 0;
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < i; j++) {
          if (compareKeys(keys[j], keys[i]) <= 0 && dp[j] + 1 > dp[i]) {
            dp[i]   = dp[j] + 1;
            prev[i] = j;
          }
        }
        if (dp[i] > dp[bestEnd]) bestEnd = i;
      }
      const set = new Set();
      for (let i = bestEnd; i !== -1; i = prev[i]) set.add(i);
      return set;
    }

    // Group books into shelf rows by Y-coordinate clustering.
    // Within each shelf, books are sorted left-to-right by X-center.
    // Returns { shelves: [[book, ...], ...], ungrouped: [book, ...] }.
    function groupByShelf(books) {
      const ungrouped = [];
      const boxed    = [];
      for (const b of books) {
        if (!b.bounding_box || b.bounding_box.length !== 4) ungrouped.push(b);
        else boxed.push(b);
      }
      if (boxed.length === 0) return { shelves: [], ungrouped };

      // Compute Y-center and height per book
      const enriched = boxed.map(b => {
        const [ymin, , ymax] = b.bounding_box;
        return { book: b, yc: (ymin + ymax) / 2, h: Math.max(1, ymax - ymin) };
      });

      // Sort by Y-center
      enriched.sort((a, b) => a.yc - b.yc);

      // Median spine height — threshold for starting a new shelf
      const heights = [...enriched.map(e => e.h)].sort((a, b) => a - b);
      const medianH = heights[Math.floor(heights.length / 2)] || 100;
      const gapThreshold = medianH * 0.6;

      // Walk and split into shelves
      const shelves = [[enriched[0]]];
      for (let i = 1; i < enriched.length; i++) {
        const gap = enriched[i].yc - enriched[i - 1].yc;
        if (gap > gapThreshold) shelves.push([]);
        shelves[shelves.length - 1].push(enriched[i]);
      }

      // Within each shelf, sort by X-center (left to right)
      const result = shelves.map(shelf => {
        shelf.sort((a, b) => {
          const ax = (a.book.bounding_box[1] + a.book.bounding_box[3]) / 2;
          const bx = (b.book.bounding_box[1] + b.book.bounding_box[3]) / 2;
          return ax - bx;
        });
        return shelf.map(e => e.book);
      });

      return { shelves: result, ungrouped };
    }

    // Clip box heights so they don't bleed across shelves.
    // For each shelf, compute median ymin/ymax; clamp outliers to that band.
    function clipShelfBoxes(shelfBooks) {
      if (shelfBooks.length < 2) return shelfBooks;
      const ymins = shelfBooks.map(b => b.bounding_box[0]).sort((a, b) => a - b);
      const ymaxs = shelfBooks.map(b => b.bounding_box[2]).sort((a, b) => a - b);
      const medYmin = ymins[Math.floor(ymins.length / 2)];
      const medYmax = ymaxs[Math.floor(ymaxs.length / 2)];
      const heights = shelfBooks.map(b => b.bounding_box[2] - b.bounding_box[0]).sort((a, b) => a - b);
      const medH = heights[Math.floor(heights.length / 2)];
      const tol = medH * 0.25;

      return shelfBooks.map(b => {
        const [ymin, xmin, ymax, xmax] = b.bounding_box;
        const clampedYmin = ymin < medYmin - tol ? medYmin : ymin;
        const clampedYmax = ymax > medYmax + tol ? medYmax : ymax;
        return { ...b, bounding_box: [clampedYmin, xmin, clampedYmax, xmax] };
      });
    }

    // Sanitize bounding boxes within a shelf: clamp oversized widths and resolve overlaps.
    // Books must already be sorted left-to-right by X-center.
    function sanitizeShelfBoxes(shelfBooks) {
      if (shelfBooks.length < 2) return shelfBooks;

      // Median width — used to cap outliers
      const widths = shelfBooks.map(b => b.bounding_box[3] - b.bounding_box[1]).sort((a, b) => a - b);
      const medW = widths[Math.floor(widths.length / 2)];
      const maxW = medW * 1.8;  // no box wider than 1.8× median

      const fixed = shelfBooks.map(b => {
        let [ymin, xmin, ymax, xmax] = b.bounding_box;
        const w = xmax - xmin;
        if (w > maxW) {
          // Shrink toward center
          const cx = (xmin + xmax) / 2;
          xmin = cx - maxW / 2;
          xmax = cx + maxW / 2;
        }
        return { ...b, bounding_box: [ymin, xmin, ymax, xmax] };
      });

      // Resolve horizontal overlaps: push adjacent boxes apart so arrows don't stack
      for (let i = 0; i < fixed.length - 1; i++) {
        const bbA = fixed[i].bounding_box;
        const bbB = fixed[i + 1].bounding_box;
        if (bbA[3] > bbB[1]) {
          // Overlap detected — split at midpoint
          const mid = (bbA[3] + bbB[1]) / 2;
          fixed[i]     = { ...fixed[i],     bounding_box: [bbA[0], bbA[1], bbA[2], mid] };
          fixed[i + 1] = { ...fixed[i + 1], bounding_box: [bbB[0], mid,    bbB[2], bbB[3]] };
        }
      }

      return fixed;
    }

    // Check order for a single shelf of books (already sorted left→right within the shelf).
    function checkOrderOneShelf(books, section) {
      const keys = books.map(b => sortKey(b, section));
      const verifiableIdx = [];
      keys.forEach((k, i) => { if (k !== null) verifiableIdx.push(i); });

      const verifiableKeys = verifiableIdx.map(i => keys[i]);
      const lisLocal       = longestNonDecreasingSubseq(verifiableKeys);
      const lisGlobal      = new Set([...lisLocal].map(localIdx => verifiableIdx[localIdx]));

      // Ideal position = the slot (within this shelf) that the rank-th sorted book occupies.
      // Positions are 1-indexed WITHIN this shelf only.
      const sortedVerifiable = [...verifiableIdx].sort((a, b) => compareKeys(keys[a], keys[b]));
      const idealRank = new Map();
      sortedVerifiable.forEach((origIdx, rank) => {
        idealRank.set(origIdx, verifiableIdx[rank] + 1);
      });

      // Compute tied-group slot ranges: for each book, the inclusive [min,max] slot range
      // of all verifiable books that tie with it. If a book's current shelf position falls
      // inside its tied range, it's not really "out of order" even if the LIS excluded it.
      const tiedGroupSlots = new Map();
      let r = 0;
      while (r < sortedVerifiable.length) {
        let s = r;
        while (
          s + 1 < sortedVerifiable.length &&
          compareKeys(keys[sortedVerifiable[s + 1]], keys[sortedVerifiable[r]]) === 0
        ) s++;
        // Slot range = [verifiableIdx[r]+1, verifiableIdx[s]+1]
        const lo = verifiableIdx[r] + 1;
        const hi = verifiableIdx[s] + 1;
        for (let k = r; k <= s; k++) {
          tiedGroupSlots.set(sortedVerifiable[k], [lo, hi]);
        }
        r = s + 1;
      }

      const checked = books.map((book, i) => {
        // Shelf-relative position is i+1
        const shelfPos = i + 1;
        if (keys[i] === null) {
          return {
            ...book, outOfOrder: false, unverifiable: true,
            idealPosition: null, shelfPosition: shelfPos,
            shelfSize: books.length, tiedGroupSlots: null,
          };
        }
        const ideal = idealRank.get(i) ?? null;
        const tied  = tiedGroupSlots.get(i) || null;
        // If position falls inside its tied group's slot range, treat as in-order
        const inTiedRange = tied && shelfPos >= tied[0] && shelfPos <= tied[1];
        const inLis = lisGlobal.has(i);
        const outOfOrder = !inLis && !inTiedRange;
        return {
          ...book,
          outOfOrder,
          unverifiable: false,
          idealPosition: ideal,
          shelfPosition: shelfPos,
          shelfSize: books.length,
          tiedGroupSlots: tied,
        };
      });

      // Sandwich rule: a red book surrounded by greens whose keys MATCH or are CLOSE
      // is almost certainly an OCR misread, not a real misplacement.
      // Rule 1: Exact match — nearest non-red neighbors have IDENTICAL keys.
      // Rule 2: Outlier — both neighbors' primary value (surname / dewey) are within
      //         1 letter of each other but the flagged book's primary value is far away.
      //         "far" = the first letter differs by ≥3 positions in the alphabet.
      for (let i = 0; i < checked.length; i++) {
        if (!checked[i].outOfOrder) continue;
        let L = i - 1;
        while (L >= 0 && checked[L].outOfOrder) L--;
        let R = i + 1;
        while (R < checked.length && checked[R].outOfOrder) R++;
        if (L < 0 || R >= checked.length) continue;
        const kL = keys[L], kR = keys[R], kM = keys[i];
        if (!kL || !kR || !kM) continue;

        let demote = false;

        // Rule 1: exact match between neighbors
        if (compareKeys(kL, kR) === 0) {
          demote = true;
        }

        // Rule 2: neighbors close to each other, flagged book far from both
        if (!demote && kL.kind === kR.kind && kM.kind === kL.kind) {
          const valL = kL.kind === 'str' ? kL.val : String(kL.val.num ?? '');
          const valR = kR.kind === 'str' ? kR.val : String(kR.val.num ?? '');
          const valM = kM.kind === 'str' ? kM.val : String(kM.val.num ?? '');
          if (valL && valR && valM) {
            const neighborsClose = valL.charAt(0) === valR.charAt(0);
            const farFromL = Math.abs(valM.charCodeAt(0) - valL.charCodeAt(0)) >= 3;
            const farFromR = Math.abs(valM.charCodeAt(0) - valR.charCodeAt(0)) >= 3;
            if (neighborsClose && farFromL && farFromR) {
              demote = true;
            }
          }
        }

        if (demote) {
          checked[i].outOfOrder    = false;
          checked[i].unverifiable  = true;
          checked[i].idealPosition = null;
        }
      }

      return checked;
    }

    // Public entry: group by shelf, clip boxes per shelf, run order check per shelf,
    // and flatten back to a single array (preserving each book's display position).
    function checkOrder(books, section) {
      const { shelves, ungrouped } = groupByShelf(books);
      const checkedShelves = shelves.flatMap((shelf, si) => {
        const clipped   = clipShelfBoxes(shelf);
        const sanitized = sanitizeShelfBoxes(clipped);
        // Tag each book with its shelf index so we can match shelf-mates later
        return checkOrderOneShelf(sanitized, section).map(b => ({ ...b, shelfIndex: si }));
      });
      // Ungrouped books (no bounding box) — pass through as unverifiable, no shelf info
      const checkedUngrouped = ungrouped.map(b => ({
        ...b, outOfOrder: false, unverifiable: true, idealPosition: null,
        shelfPosition: null, shelfSize: null, shelfIndex: -1, tiedGroupSlots: null,
      }));
      return [...checkedShelves, ...checkedUngrouped];
    }

    // ── Shared helper: map a bounding box to pixel coords over cameraWrap ──
    // Used by both renderStep arrows and renderUnverifiableMarkers.
    function bbToDisplay(bb) {
      const cw = snapshot.width, ch = snapshot.height;
      const rect = snapshot.getBoundingClientRect();
      const wrapRect = cameraWrap.getBoundingClientRect();
      const dispScale = Math.min(rect.width / cw, rect.height / ch);
      const dispW = cw * dispScale, dispH = ch * dispScale;
      const offX = (rect.width  - dispW) / 2 + (rect.left - wrapRect.left);
      const offY = (rect.height - dispH) / 2 + (rect.top  - wrapRect.top);
      const [ymin, xmin, , xmax] = bb;
      const cx = ((xmin + xmax) / 2 / 1000) * cw;
      const ty = (ymin / 1000) * ch;
      return {
        left: offX + cx * dispScale,
        top:  Math.max(8, offY + ty * dispScale - 4),
      };
    }

    // ── Persistent yellow "?" markers for unverifiable books ──
    function renderUnverifiableMarkers() {
      document.getElementById('unvMarkers')?.remove();
      const unvBooks = lastCheckedBooks.filter(b => b.unverifiable && b.bounding_box);
      if (unvBooks.length === 0) return;

      const wrap = document.createElement('div');
      wrap.id = 'unvMarkers';
      wrap.className = 'unv-markers-wrap';
      cameraWrap.appendChild(wrap);

      for (const book of unvBooks) {
        const pos = bbToDisplay(book.bounding_box);
        const marker = document.createElement('div');
        marker.className = 'unv-marker';
        marker.style.left = `${pos.left}px`;
        marker.style.top  = `${pos.top}px`;
        marker.innerHTML = `<div class="unv-marker-pill">?</div><div class="unv-marker-tip"></div>`;
        wrap.appendChild(marker);
      }
    }

    // ── Results: step-through mode (one issue at a time) ─────
    let lastCheckedBooks = [];
    let stepIssues = [];
    let stepCursor = 0;

    function showResults(books, section) {
      const checked = checkOrder(books, section);
      lastCheckedBooks = checked;

      // Clean up any prior result UI before rendering new state
      document.getElementById('resultsOverlay')?.remove();
      document.getElementById('stepThrough')?.remove();

      // Step-through only covers out-of-order books. Unverifiable books get
      // persistent yellow "?" tags rendered on the photo at all times.
      stepIssues = checked
        .filter(b => b.bounding_box && b.outOfOrder)
        .sort((a, b) => (a.shelfPosition ?? 0) - (b.shelfPosition ?? 0));

      const outCount = checked.filter(b => b.outOfOrder).length;
      const unvCount = checked.filter(b => b.unverifiable).length;

      actionBtns.classList.remove('show');
      enableInspect();

      // Render persistent yellow markers for unverifiable books
      renderUnverifiableMarkers();

      if (stepIssues.length === 0) {
        showSimpleBadge(outCount, unvCount);
      } else {
        stepCursor = 0;
        showStepThrough(outCount, unvCount);
      }
    }

    function showSimpleBadge(outCount, unvCount) {
      let badgeClass, badgeText;
      if (outCount > 0)       { badgeClass = 'badge-warn';         badgeText = `⚠ ${outCount} to move`; }
      else if (unvCount > 0)  { badgeClass = 'badge-unverifiable'; badgeText = `⚠ ${unvCount} unverifiable`; }
      else                    { badgeClass = 'badge-ok';           badgeText = '✓ All in order'; }

      const overlay = document.createElement('div');
      overlay.id        = 'resultsOverlay';
      overlay.className = 'results-overlay';
      overlay.innerHTML = `
        <div class="overlay-badge ${badgeClass}">${badgeText}</div>
        <button class="btn-new-scan" onclick="newScan()">New Scan</button>`;
      photoArea.appendChild(overlay);
    }

    function showStepThrough(outCount, unvCount) {
      const container = document.createElement('div');
      container.id = 'stepThrough';
      const summary = outCount > 0
        ? `${outCount} to move${unvCount ? ` · ${unvCount} unverifiable` : ''}`
        : `${unvCount} unverifiable`;
      container.innerHTML = `
        <div class="step-arrow" id="stepArrow">
          <div class="step-arrow-num" id="stepArrowNum">1</div>
          <div class="step-arrow-tip"></div>
        </div>
        <div class="step-arrow-dest" id="stepArrowDest" style="display:none">
          <div class="step-arrow-dest-pill">place here</div>
          <div class="step-arrow-dest-tip"></div>
        </div>
        <div class="step-card" id="stepCard">
          <div class="step-card-top">
            <span class="step-summary">${summary}</span>
            <span class="step-counter" id="stepCounter"></span>
          </div>
          <div class="step-title" id="stepTitle">—</div>
          <div class="step-meta" id="stepMeta">—</div>
          <div class="step-action" id="stepAction">—</div>
          <div class="step-nav">
            <button class="step-btn" id="stepPrev">← Prev</button>
            <button class="step-btn step-btn-primary" id="stepNewScan">New Scan</button>
            <button class="step-btn" id="stepNext">Next →</button>
          </div>
        </div>`;
      cameraWrap.appendChild(container);

      document.getElementById('stepPrev').onclick = () => {
        stepCursor = (stepCursor - 1 + stepIssues.length) % stepIssues.length;
        renderStep();
      };
      document.getElementById('stepNext').onclick = () => {
        stepCursor = (stepCursor + 1) % stepIssues.length;
        renderStep();
      };
      document.getElementById('stepNewScan').onclick = newScan;

      renderStep();
    }

    function renderStep() {
      const book = stepIssues[stepCursor];
      if (!book) return;

      // Position the source arrow at this book's X-center, just above its top edge.
      const arrow = document.getElementById('stepArrow');
      if (arrow && book.bounding_box) {
        const pos = bbToDisplay(book.bounding_box);
        arrow.style.left = `${pos.left}px`;
        arrow.style.top  = `${pos.top}px`;
        arrow.classList.toggle('step-arrow-warn', !!book.outOfOrder);
        arrow.classList.toggle('step-arrow-unv',  !!book.unverifiable && !book.outOfOrder);
      }

      // Find the destination book (the one currently sitting at idealPosition on this shelf).
      // Used by both the green arrow and the card text below.
      let dest = null;
      let destVisible = false;
      if (book.outOfOrder && book.idealPosition && book.shelfPosition) {
        dest = lastCheckedBooks.find(
          b => b.shelfIndex === book.shelfIndex && b.shelfPosition === book.idealPosition
        );
        destVisible = !!(dest && dest.bounding_box);
      }

      // Destination arrow: green, shown when we can point at the target location.
      const destArrow = document.getElementById('stepArrowDest');
      if (destArrow) {
        if (destVisible) {
          const pos = bbToDisplay(dest.bounding_box);
          destArrow.style.left = `${pos.left}px`;
          destArrow.style.top  = `${pos.top}px`;
          destArrow.style.display = '';
        } else {
          destArrow.style.display = 'none';
        }
      }

      document.getElementById('stepArrowNum').textContent = String(book.shelfPosition ?? book.position ?? '?');
      document.getElementById('stepCounter').textContent = `Issue ${stepCursor + 1} of ${stepIssues.length}`;
      document.getElementById('stepTitle').textContent   = book.title || '(unreadable title)';

      const metaParts = [];
      if (book.author_last)       metaParts.push(book.author_last);
      if (book.spine_label)       metaParts.push(book.spine_label);
      if (book.series_volume != null) metaParts.push(`#${book.series_volume}`);
      document.getElementById('stepMeta').textContent = metaParts.join(' · ') || '—';

      const actionEl = document.getElementById('stepAction');
      if (book.unverifiable && !book.outOfOrder) {
        actionEl.textContent = "Couldn't read this spine clearly — verify visually.";
        actionEl.style.background = '#713f12';
        actionEl.style.color      = '#fde047';
      } else if (book.outOfOrder && book.idealPosition && book.shelfPosition) {
        const dir = book.idealPosition < book.shelfPosition ? 'LEFT' : 'RIGHT';
        if (dest) {
          const destName = dest.title || dest.spine_label
            || (dest.author_last ? `${dest.author_last}'s book` : `position ${book.idealPosition}`);
          actionEl.innerHTML = `Move <b>${dir}</b> — place before <b>${escapeHtml(String(destName))}</b>`;
          actionEl.style.background = '#1e3a8a';
          actionEl.style.color      = '#dbeafe';
        } else {
          // Destination isn't visible in this photo
          actionEl.innerHTML = `This book is <b>out of order</b> — its correct spot isn't visible in this photo. It should go <b>${dir}</b>, off the edge of the shelf shown.`;
          actionEl.style.background = '#78350f';
          actionEl.style.color      = '#fde68a';
        }
      } else {
        actionEl.textContent = '';
      }
    }

    // Reposition arrows and markers if the viewport changes (rotation, etc).
    window.addEventListener('resize', () => {
      if (stepIssues.length > 0 && document.getElementById('stepThrough')) renderStep();
      if (document.getElementById('unvMarkers')) renderUnverifiableMarkers();
    });

    // ── Tap-to-inspect: show OCR readout for the tapped book ──
    function enableInspect() {
      snapshot.style.pointerEvents = 'auto';
      snapshot.style.cursor = 'pointer';
      snapshot.addEventListener('click', inspectHandler);
    }

    function disableInspect() {
      snapshot.style.pointerEvents = '';
      snapshot.style.cursor = '';
      snapshot.removeEventListener('click', inspectHandler);
      document.getElementById('bookInspect')?.remove();
    }

    function inspectHandler(e) {
      // Translate click to canvas-internal coordinates (object-fit: contain)
      const rect = snapshot.getBoundingClientRect();
      const cw = snapshot.width, ch = snapshot.height;
      const dispScale = Math.min(rect.width / cw, rect.height / ch);
      const dispW = cw * dispScale, dispH = ch * dispScale;
      const offX = (rect.width  - dispW) / 2;
      const offY = (rect.height - dispH) / 2;
      const px = (e.clientX - rect.left - offX) / dispScale;
      const py = (e.clientY - rect.top  - offY) / dispScale;

      // Hit-test against book boxes (prefer smallest box if multiple contain the point)
      let best = null, bestArea = Infinity;
      for (const b of lastCheckedBooks) {
        if (!b.bounding_box) continue;
        const [ymin, xmin, ymax, xmax] = b.bounding_box;
        const x = (xmin / 1000) * cw;
        const y = (ymin / 1000) * ch;
        const w = ((xmax - xmin) / 1000) * cw;
        const h = ((ymax - ymin) / 1000) * ch;
        if (px >= x && px <= x + w && py >= y && py <= y + h) {
          const area = w * h;
          if (area < bestArea) { best = b; bestArea = area; }
        }
      }

      document.getElementById('bookInspect')?.remove();
      if (!best) return;

      const confColor = best.confidence === 'high' ? '#4ade80' : best.confidence === 'medium' ? '#facc15' : '#f87171';

      // Build a "where to move" message for red books.
      // Find the book currently sitting at the ideal shelf-position so we can name it.
      let moveText = null;
      if (best.outOfOrder && best.idealPosition && best.shelfPosition) {
        const dest = lastCheckedBooks.find(
          b => b.shelfIndex === best.shelfIndex && b.shelfPosition === best.idealPosition
        );
        const direction = best.idealPosition < best.shelfPosition ? 'left' : 'right';
        if (dest) {
          const destName = dest.title || dest.spine_label
            || (dest.author_last && `${dest.author_last}'s book`)
            || `the book at position ${best.idealPosition}`;
          moveText = `Move ${direction} — place before <b>${escapeHtml(String(destName))}</b> (currently #${best.idealPosition} on this shelf).`;
        } else {
          moveText = `Out of order — correct spot is off the edge of this photo (${direction}).`;
        }
      }

      const status = best.unverifiable ? 'Couldn\'t read this spine clearly — not sure if it\'s in order.'
                   : best.outOfOrder    ? `Out of order — should be at shelf position ${best.idealPosition}.`
                   :                       '✓ In order';

      const card = document.createElement('div');
      card.id = 'bookInspect';
      card.className = 'book-inspect';
      card.innerHTML = `
        <div class="bi-row"><span class="bi-key">Title</span><span class="bi-val">${escapeHtml(best.title) || '—'}</span></div>
        <div class="bi-row"><span class="bi-key">Author</span><span class="bi-val">${escapeHtml(best.author_last) || '—'}</span></div>
        <div class="bi-row"><span class="bi-key">Label</span><span class="bi-val">${escapeHtml(best.spine_label || best.call_number) || '—'}</span></div>
        ${best.series_volume != null ? `<div class="bi-row"><span class="bi-key">Volume</span><span class="bi-val">#${best.series_volume}</span></div>` : ''}
        <div class="bi-row"><span class="bi-key">Confidence</span><span class="bi-val"><span class="bi-dot" style="background:${confColor}"></span>${best.confidence || '—'}</span></div>
        <div class="bi-row"><span class="bi-key">Position</span><span class="bi-val">${best.shelfPosition ?? '—'} of ${best.shelfSize ?? '—'} on this shelf</span></div>
        <div class="bi-status">${status}</div>
        ${moveText ? `<div class="bi-move">${moveText}</div>` : ''}
        <button class="bi-close" aria-label="Close">×</button>`;
      photoArea.appendChild(card);
      card.querySelector('.bi-close').addEventListener('click', () => card.remove());
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function newScan() {
      document.getElementById('resultsOverlay')?.remove();
      document.getElementById('stepThrough')?.remove();
      document.getElementById('unvMarkers')?.remove();
      stepIssues = [];
      disableInspect();
      retake();
    }

    analyzeBtn.addEventListener('click', analyzeShelf);

    // Auto-start camera on load
    startCamera();
  </script>

</body>
</html>
