<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ShelfCheck</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;
      background: #0d0d0d; color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }

    /* Header */
    .header {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
      background: #1c1c1c; border-bottom: 1px solid #2c2c2c;
    }
    .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .header h1 span { color: #5b9dff; }
    .badge {
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: #222; color: #888; border: 1px solid #333;
    }
    .badge.gpu { color: #6ee7a8; border-color: #1f5137; background: #10271b; }
    .badge.wasm { color: #ffd166; border-color: #5a4a1a; background: #2a2410; }

    /* Layout */
    main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }
    .card { background: #161616; border: 1px solid #262626; border-radius: 14px; padding: 16px; }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 12px; }

    /* Section toggle */
    .seg { display: flex; gap: 8px; }
    .seg button {
      flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #2c2c2c;
      background: #1c1c1c; color: #ccc; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all .15s;
    }
    .seg button.active { background: #1d3a6e; border-color: #2f5fb0; color: #fff; }

    /* Buttons */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 16px; border-radius: 12px; border: none;
      font-size: 16px; font-weight: 700; cursor: pointer; transition: filter .15s;
    }
    .btn:active { filter: brightness(1.15); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #2f6fed; color: #fff; }
    .btn-ghost { background: #232323; color: #ddd; border: 1px solid #333; }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; }

    /* Camera / preview */
    .stage { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
    .stage video, .stage canvas, .stage img { width: 100%; display: block; }
    .frame-guide {
      position: absolute; inset: 8% 5%; border: 2px dashed rgba(255,255,255,.4);
      border-radius: 10px; pointer-events: none;
    }
    .frame-guide::after {
      content: "Fill the frame with one shelf — straight on";
      position: absolute; bottom: -2px; left: 50%; transform: translate(-50%, 120%);
      font-size: 12px; color: rgba(255,255,255,.6); white-space: nowrap;
    }

    /* Status */
    .status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #bbb; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid #333; border-top-color: #5b9dff;
      border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress { height: 6px; background: #222; border-radius: 999px; overflow: hidden; margin-top: 10px; }
    .progress > div { height: 100%; width: 0; background: #2f6fed; transition: width .3s; }

    /* Results */
    .summary { display: flex; gap: 12px; margin-bottom: 14px; }
    .stat { flex: 1; text-align: center; padding: 12px; border-radius: 10px; background: #1a1a1a; border: 1px solid #2a2a2a; }
    .stat .n { font-size: 24px; font-weight: 800; }
    .stat .l { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .5px; }
    .stat.ok .n { color: #6ee7a8; }
    .stat.bad .n { color: #ff6b6b; }

    .list { display: flex; flex-direction: column; gap: 6px; }
    .item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
      background: #1a1a1a; border: 1px solid #2a2a2a; font-size: 14px;
    }
    .item.bad { background: #2a1414; border-color: #5a2020; }
    .item.unsure { background: #2a2410; border-color: #5a4a1a; }
    .item .pos { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: #2a2a2a;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #aaa; }
    .item.bad .pos { background: #5a2020; color: #ffb3b3; }
    .item.unsure .pos { background: #5a4a1a; color: #ffe08a; }
    .item .txt { flex: 1; }
    .item .conf { font-size: 11px; color: #777; }
    .item .conf.low { color: #ffd166; }

    .hint { font-size: 13px; color: #888; line-height: 1.5; }
    .error { background: #2a1414; border: 1px solid #5a2020; color: #ffb3b3; padding: 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    details { margin-top: 10px; }
    summary { cursor: pointer; font-size: 12px; color: #777; }
    pre { margin-top: 8px; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 10px; font-size: 11px; overflow: auto; max-height: 240px; color: #9bbcff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 Shelf<span>Check</span></h1>
    <span id="engineBadge" class="badge">engine: idle</span>
  </div>

  <main>
    <!-- SECTION SELECT -->
    <div class="card" id="setupCard">
      <h2>1 · Section type</h2>
      <div class="seg">
        <button id="segFiction" class="active" data-mode="fiction">Fiction<br><small style="font-weight:400;color:#9ab">by author</small></button>
        <button id="segNonfiction" data-mode="nonfiction">Nonfiction<br><small style="font-weight:400;color:#9ab">by Dewey #</small></button>
      </div>
    </div>

    <!-- INPUT -->
    <div class="card" id="inputCard">
      <h2>2 · Capture a shelf</h2>
      <div class="stage" id="cameraStage">
        <video id="video" playsinline muted autoplay class="hidden"></video>
        <div class="frame-guide hidden" id="frameGuide"></div>
        <img id="placeholder" alt="" class="hidden">
      </div>
      <div style="height:12px"></div>
      <div class="btn-row" id="captureControls">
        <button class="btn btn-primary" id="startCamBtn">📷 Use camera</button>
        <button class="btn btn-ghost" id="uploadBtn">🖼️ Upload photo</button>
      </div>
      <button class="btn btn-primary hidden" id="snapBtn" style="margin-top:10px">📸 Capture</button>
      <input type="file" id="fileInput" accept="image/*" class="hidden">
    </div>

    <!-- PROCESSING -->
    <div class="card hidden" id="processCard">
      <h2>3 · Reading the shelf</h2>
      <div class="status"><div class="spinner"></div><span id="processMsg">Starting…</span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>

    <!-- RESULTS -->
    <div class="card hidden" id="resultsCard">
      <h2>4 · Results</h2>
      <div class="summary">
        <div class="stat"><div class="n" id="statTotal">0</div><div class="l">books read</div></div>
        <div class="stat ok"><div class="n" id="statOk">0</div><div class="l">in order</div></div>
        <div class="stat bad"><div class="n" id="statBad">0</div><div class="l">out of order</div></div>
      </div>
      <div class="stage"><canvas id="overlay"></canvas></div>
      <div style="height:14px"></div>
      <div class="list" id="resultList"></div>
      <div style="height:14px"></div>
      <button class="btn btn-ghost" id="retakeBtn">↩︎ Scan another shelf</button>
    </div>

    <!-- ERRORS / DEBUG -->
    <div class="card hidden" id="errorCard">
      <h2>Something went wrong</h2>
      <div class="error" id="errorMsg"></div>
    </div>

    <div class="card">
      <details id="debugBox">
        <summary>Debug — raw OCR output (for tuning)</summary>
        <pre id="rawDump">No scan yet.</pre>
      </details>
    </div>
  </main>

  <script type="module">
    // ─────────────────────────────────────────────────────────────
    // ShelfCheck — on-device OCR shelf-order checker
    // OCR engine: ppu-paddle-ocr (PaddleOCR PP-OCRv5, ONNX Runtime Web, WebGPU)
    // No cloud AI. Everything runs in the browser.
    // ─────────────────────────────────────────────────────────────

    const $ = (id) => document.getElementById(id);
    const els = {
      engineBadge: $('engineBadge'),
      segFiction: $('segFiction'), segNonfiction: $('segNonfiction'),
      cameraStage: $('cameraStage'), video: $('video'), frameGuide: $('frameGuide'),
      startCamBtn: $('startCamBtn'), uploadBtn: $('uploadBtn'), snapBtn: $('snapBtn'),
      fileInput: $('fileInput'),
      inputCard: $('inputCard'), processCard: $('processCard'), processMsg: $('processMsg'),
      progressBar: $('progressBar'),
      resultsCard: $('resultsCard'), overlay: $('overlay'), resultList: $('resultList'),
      statTotal: $('statTotal'), statOk: $('statOk'), statBad: $('statBad'),
      retakeBtn: $('retakeBtn'),
      errorCard: $('errorCard'), errorMsg: $('errorMsg'),
      rawDump: $('rawDump'),
    };

    let mode = 'fiction';
    let ocr = null;            // PaddleOcrService instance
    let stream = null;         // camera MediaStream

    // ── Section toggle ───────────────────────────────────────────
    els.segFiction.onclick = () => setMode('fiction');
    els.segNonfiction.onclick = () => setMode('nonfiction');
    function setMode(m) {
      mode = m;
      els.segFiction.classList.toggle('active', m === 'fiction');
      els.segNonfiction.classList.toggle('active', m === 'nonfiction');
    }

    // ── Camera ───────────────────────────────────────────────────
    els.startCamBtn.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false,
        });
        els.video.srcObject = stream;
        els.video.classList.remove('hidden');
        els.frameGuide.classList.remove('hidden');
        els.startCamBtn.classList.add('hidden');
        els.uploadBtn.classList.add('hidden');
        els.snapBtn.classList.remove('hidden');
      } catch (e) {
        showError('Could not open the camera.\n' + e.message + '\n\nTip: camera needs HTTPS (or localhost). You can still use "Upload photo".');
      }
    };

    els.snapBtn.onclick = () => {
      const v = els.video;
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      stopCamera();
      runPipeline(c);
    };

    function stopCamera() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      els.video.classList.add('hidden');
      els.frameGuide.classList.add('hidden');
    }

    // ── Upload ───────────────────────────────────────────────────
    els.uploadBtn.onclick = () => els.fileInput.click();
    els.fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      runPipeline(c);
    };

    // ── OCR backend (fast, high quality) ─────────────────────────
    // Deployed on Hugging Face Spaces — replace the URL below with
    // your Space's public URL after deploying server/.
    // To override locally: localStorage.setItem('shelfcheck_backend', 'http://127.0.0.1:8000')
    const BACKEND_URL = localStorage.getItem('shelfcheck_backend') || 'https://krfish-shelfcheck-ocr.hf.space';
    const BACKEND_TIMEOUT = 45000;

    async function ocrViaBackend(canvas) {
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
      const fd = new FormData();
      fd.append('file', blob, 'shelf.jpg');
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), BACKEND_TIMEOUT);
      try {
        const resp = await fetch(BACKEND_URL + '/ocr', { method: 'POST', body: fd, signal: ctrl.signal });
        if (!resp.ok) throw new Error('server returned ' + resp.status);
        const data = await resp.json();
        return data.regions || [];     // [{ text, score, quad }]
      } finally {
        clearTimeout(timer);
      }
    }

    // ── On-device fallback (PaddleOCR on onnxruntime-web) ─────────
    let ppocr = null;
    async function getOcr() {
      if (ocr) return ocr;
      setProcess('Loading on-device OCR (first time downloads ~13 MB)…', 10);
      ppocr = await import('./ppocr.js');
      await ppocr.init({
        detUrl: './models/det.onnx',
        recUrl: './models/rec.onnx',
        dictUrl: './models/ppocr_keys_v1.txt',
        onStatus: (s) => setProcess(s, 35),
      });
      ocr = ppocr;
      return ocr;
    }

    // Downscale large photos to a max side (matches server cap) —
    // smaller upload, and keeps overlay coords consistent.
    function fitCanvas(src, maxSide = 2048) {
      const long = Math.max(src.width, src.height);
      if (long <= maxSide) return src;
      const s = maxSide / long;
      const c = document.createElement('canvas');
      c.width = Math.round(src.width * s);
      c.height = Math.round(src.height * s);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return c;
    }

    // ── Main pipeline ────────────────────────────────────────────
    async function runPipeline(canvas) {
      hide(els.inputCard); hide(els.resultsCard); hide(els.errorCard);
      show(els.processCard);
      try {
        const small = fitCanvas(canvas, 2048);  // OCR + overlay use the same canvas
        let raw;
        try {
          setProcess('Sending to OCR server…', 30);
          raw = await ocrViaBackend(small);
          els.engineBadge.textContent = 'engine: server ⚡';
          els.engineBadge.className = 'badge gpu';
        } catch (err) {
          console.warn('[ShelfCheck] backend unavailable, falling back to on-device:', err);
          setProcess('Server unavailable — using on-device OCR…', 30);
          const engine = await getOcr();
          raw = await engine.runOcr(small, (s) => setProcess(s, 60));
          els.engineBadge.textContent = 'engine: on-device';
          els.engineBadge.className = 'badge wasm';
        }
        els.rawDump.textContent = safeStringify(raw.map(r => ({ text: r.text, score: +(r.score || 0).toFixed(2), quad: r.quad || r.box })));
        console.log('[ShelfCheck] raw OCR result:', raw);

        const lines = normalizeOcr(raw);
        if (!lines.length) throw new Error('No readable text found. Try a sharper, straight-on photo.');

        setProcess('Grouping books and checking order…', 85);
        const books = groupBooks(lines, mode);
        if (!books.length) throw new Error(
          'Read ' + lines.length + ' text snippets but none looked like spine labels.\n' +
          'Open the Debug box to see what OCR read — we may need to tune the label filter.');

        let checked = checkOrder(books, mode);
        if (mode === 'fiction') {
          setProcess('Checking the catalogue…', 92);
          checked = await canonicalizeAndRecheck(checked, mode);
        }
        renderResults(small, checked);
      } catch (e) {
        console.error(e);
        showError(e.message || String(e));
      }
    }

    // ── Normalize OCR result into [{text, score, quad}] ──────────
    // Backend regions give { text, score, quad:[[x,y]x4] }.
    // On-device regions give { text, score, box:{x,y,w,h} }.
    function normalizeOcr(raw) {
      return (raw || []).map(r => {
        let quad = r.quad;
        if (!quad && r.box) {
          const b = r.box, x = num(b.x), y = num(b.y), w = num(b.w), h = num(b.h);
          quad = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
        }
        return { text: (r.text || '').trim(), score: num(r.score), quad };
      }).filter(l => l.text && l.quad);
    }

    const num = (v) => (typeof v === 'number' ? v : parseFloat(v) || 0);

    function bboxOf(quad) {
      if (!quad) return null;
      const xs = quad.map(p => p[0]), ys = quad.map(p => p[1]);
      return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys),
               cx: (Math.min(...xs) + Math.max(...xs)) / 2, cy: (Math.min(...ys) + Math.max(...ys)) / 2 };
    }

    // ── Per-book grouping ────────────────────────────────────────
    // Each physical book = one LABEL (author, bottom of spine) + a
    // TITLE (up the spine). We anchor on the author label, then attach
    // the first name and title from the same spine column. Titles are
    // kept as the same-author tiebreak — not discarded.
    const clean = (s) => (s || '').replace(/[^A-Za-z]/g, '').toUpperCase();
    // surname key keeps internal spaces so "VON ARNIM" files in the V's
    // (space sorts before letters, matching library filing order).
    const keyStr = (s) => (s || '').toUpperCase().replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
    const strcmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
    const STOP = new Set(['THE', 'OF', 'AND', 'VON', 'VAN', 'DE', 'LA', 'DER', 'DEL', 'YON']);
    // surname prefixes to keep ("YON" = common OCR misread of "VON")
    const PREFIX = new Set(['VON', 'VAN', 'DE', 'DER', 'DEL', 'LA', 'DU', 'YON']);
    const normPrefix = (s) => { const c = clean(s); return c === 'YON' ? 'VON' : c; };

    function isSurname(text) {
      const t = text.trim().replace(/[.,]+$/, '');
      const letters = t.replace(/[^A-Za-z]/g, '');
      if (letters.length < 2) return false;
      const upper = [...letters].filter(c => c === c.toUpperCase()).length / letters.length;
      return upper >= 0.7;                       // mostly uppercase = sticker surname
    }
    const isFirstName = (t) => /^[A-Z][a-z]+\.?$/.test(t.trim());

    function iou(a, b) {
      const x0 = Math.max(a.x, b.x), y0 = Math.max(a.y, b.y);
      const x1 = Math.min(a.x + a.w, b.x + b.w), y1 = Math.min(a.y + a.h, b.y + b.h);
      const inter = Math.max(0, x1 - x0) * Math.max(0, y1 - y0);
      return inter ? inter / (a.w * a.h + b.w * b.h - inter) : 0;
    }

    function groupBooks(lines, mode) {
      const regs = lines.map(l => ({ ...l, bb: bboxOf(l.quad) }))
        .filter(l => l.bb && l.score >= 0.3);
      if (!regs.length) return [];

      const isLabel = mode === 'nonfiction'
        ? (t) => /\d{1,3}(\.\d+)?/.test(t)
        : (t) => isSurname(t) && !STOP.has(clean(t));

      // 1. anchors = author/call-number labels.
      // KEY: white labels print HORIZONTALLY (box wider than tall);
      // spine titles + spine-printed author names run VERTICALLY
      // (taller than wide). So require a horizontal box — this drops
      // the title/spine-author junk that also looks "uppercase".
      const isHorizontal = (bb) => bb.w >= bb.h * 0.9;
      let anchors = regs.filter(l => isLabel(l.text) && isHorizontal(l.bb)
        && (clean(l.text).length >= 4 || l.text.includes(',')));  // drop short junk (NOI, YON)
      if (!anchors.length) return [];

      // 2. dedupe overlapping anchors (same sticker read more than once)
      anchors.sort((a, b) => b.text.length - a.text.length || b.score - a.score);
      const kept = [];
      for (const a of anchors) if (!kept.some(k => iou(k.bb, a.bb) > 0.4)) kept.push(a);
      anchors = kept;

      // 3. cluster anchors into shelf rows by vertical position
      const hs = anchors.map(a => a.bb.h).sort((x, y) => x - y);
      const medH = hs[hs.length >> 1] || 20;
      anchors.sort((a, b) => a.bb.cy - b.bb.cy);
      const rows = [];
      let row = [anchors[0]];
      for (let i = 1; i < anchors.length; i++) {
        if (Math.abs(anchors[i].bb.cy - row[row.length - 1].bb.cy) > medH * 1.8) { rows.push(row); row = []; }
        row.push(anchors[i]);
      }
      rows.push(row);

      // title candidates = VERTICAL spine text (not labels/first names)
      const titles = regs.filter(l => !isLabel(l.text) && !isFirstName(l.text)
        && l.text.replace(/[^A-Za-z]/g, '').length >= 4 && l.bb.h > l.bb.w);

      // assign each title to its NEAREST anchor by column, above the
      // label and within ~one spine — stops titles bleeding to a
      // neighbouring book or the shelf above.
      for (const t of titles) {
        let best = null, bestD = Infinity;
        for (const a of anchors) {
          if (t.bb.cy >= a.bb.y) continue;                 // title must sit above its label
          if (a.bb.cy - t.bb.cy > medH * 22) continue;     // within roughly one spine height
          const d = Math.abs(t.bb.cx - a.bb.cx);
          if (d < bestD) { bestD = d; best = a; }
        }
        if (best && bestD <= best.bb.w * 1.6) (best._titles || (best._titles = [])).push(t);
      }

      // 4. build one book per anchor, left→right within each row
      const books = [];
      for (const r of rows) {
        r.sort((a, b) => a.bb.cx - b.bb.cx);
        for (let i = 0; i < r.length; i++) {
          const a = r[i], bb = a.bb;
          const leftB = i > 0 ? (r[i - 1].bb.cx + bb.cx) / 2 : bb.x - bb.w;
          const rightB = i < r.length - 1 ? (bb.cx + r[i + 1].bb.cx) / 2 : bb.x + bb.w * 2;
          const inCol = (reg) => reg.bb.cx >= leftB && reg.bb.cx <= rightB;

          // author (label may already be "LAST, First")
          let last = a.text, first = '';
          const comma = a.text.indexOf(',');
          if (comma >= 0) { last = a.text.slice(0, comma); first = a.text.slice(comma + 1); }
          if (!first) {
            const fn = regs.filter(x => x !== a && inCol(x) && isFirstName(x.text)
              && Math.abs(x.bb.cy - bb.cy) < medH * 3)
              .sort((p, q) => Math.abs(p.bb.cy - bb.cy) - Math.abs(q.bb.cy - bb.cy))[0];
            if (fn) first = fn.text;
          }

          // surname prefix ("von","van","de"…) often sits as its own
          // region — keep it so "Von Ziegesar" files under V, not Z.
          let lastDisp = last.trim();
          if (mode !== 'nonfiction' && !STOP.has(clean(last))) {
            const pre = regs.find(x => x !== a && inCol(x) && PREFIX.has(clean(x.text))
              && Math.abs(x.bb.cy - bb.cy) < medH * 2.5);
            if (pre && !clean(last).startsWith(normPrefix(pre.text))) lastDisp = normPrefix(pre.text) + ' ' + lastDisp;
          }

          // title = longest title assigned to this anchor (nearest-column)
          const tParts = (a._titles || []).sort((p, q) => q.text.length - p.text.length);
          const titleText = tParts.length ? tParts[0].text : '';

          books.push({
            last: keyStr(lastDisp), first: clean(first), title: clean(titleText),
            num: mode === 'nonfiction' ? parseFloat((a.text.match(/\d{1,3}(\.\d+)?/) || [Infinity])[0]) : 0,
            text: (lastDisp + (first.trim() ? ', ' + first.trim() : ''))
              + (titleText ? '  ·  ' + titleText : ''),
            _qauthor: (lastDisp + ' ' + first).trim(), _qtitle: titleText.trim(),
            quad: a.quad, score: a.score,
          });
        }
      }
      return books;
    }

    function cmpBook(a, b, mode) {
      if (mode === 'nonfiction') return (a.num - b.num) || strcmp(a.last, b.last);
      return strcmp(a.last, b.last) || strcmp(a.first, b.first) || strcmp(a.title, b.title);
    }

    // Order check via Longest Non-Decreasing Subsequence: the biggest set
    // of books that ARE in order are "good"; everything else is the
    // minimal set of misplaced books. Robust to single outliers (no
    // cascade) and tells the volunteer exactly which books to move.
    function checkOrder(books, mode) {
      const n = books.length;
      if (!n) return [];
      const dp = new Array(n).fill(1), prev = new Array(n).fill(-1);
      let best = 0;
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < i; j++) {
          if (cmpBook(books[j], books[i], mode) <= 0 && dp[j] + 1 > dp[i]) {
            dp[i] = dp[j] + 1; prev[i] = j;
          }
        }
        if (dp[i] > dp[best]) best = i;
      }
      const inOrder = new Set();
      for (let k = best; k >= 0; k = prev[k]) inOrder.add(k);
      return books.map((b, i) => ({ ...b, ok: inOrder.has(i) }));
    }

    // ── Open Library canonicalisation ────────────────────────────
    // For flagged books, look up the real catalogue entry and adopt
    // the canonical author/title if it confidently matches our OCR.
    // Books we can't verify are marked "uncertain" (check manually)
    // instead of a confident "out of order".
    const bigrams = (s) => { const r = new Set(); for (let i = 0; i < s.length - 1; i++) r.add(s.slice(i, i + 2)); return r; };
    function sim(a, b) {
      if (!a || !b) return 0;
      if (a === b) return 1;
      const A = bigrams(a), B = bigrams(b);
      let inter = 0; for (const g of A) if (B.has(g)) inter++;
      return (2 * inter) / (A.size + B.size || 1);
    }
    function splitAuthor(name) {
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (parts.length <= 1) return { last: parts[0] || name, first: '' };
      let li = parts.length - 1;
      while (li - 1 >= 1 && PREFIX.has(clean(parts[li - 1]))) li--;   // keep "von" with surname
      return { last: parts.slice(li).join(' '), first: parts.slice(0, li).join(' ') };
    }

    async function olLookup(book) {
      // Only look up when we have a real TITLE to match on. Author-only
      // lookups are unreliable (a garbled surname matches random books,
      // and OL returns the author's most-popular title, not THIS one).
      const ocrTitle = clean(book._qtitle);
      if (ocrTitle.length < 5) return null;
      let data;
      try {
        const r = await fetch('https://openlibrary.org/search.json?title='
          + encodeURIComponent(book._qtitle) + '&limit=5&fields=title,author_name');
        if (!r.ok) return null;
        data = await r.json();
      } catch { return null; }
      const ocrAuthor = clean(book._qauthor);
      let best = null, bestScore = 0;
      for (const d of (data.docs || [])) {
        const an = (d.author_name && d.author_name[0]) || '';
        const ti = d.title || '';
        // must match the title we searched; nudge by author agreement
        const s = sim(ocrTitle, clean(ti)) + 0.15 * sim(ocrAuthor, clean(an));
        if (s > bestScore) { bestScore = s; best = { an, ti }; }
      }
      if (best && bestScore >= 0.6) {
        const { last, first } = splitAuthor(best.an);
        return { last, first, title: best.ti };
      }
      return null;
    }

    async function canonicalizeAndRecheck(checked, mode) {
      const flagged = checked.filter(b => !b.ok);
      await Promise.all(flagged.map(async (b) => {
        const fix = await olLookup(b);
        if (fix) {
          b.last = keyStr(fix.last); b.first = clean(fix.first); b.title = clean(fix.title);
          b.text = fix.last + (fix.first ? ', ' + fix.first : '') + (fix.title ? '  ·  ' + fix.title : '');
          b.canon = true;
        }
      }));
      const rechecked = checkOrder(checked, mode);
      // carry over canon flag; books still flagged but unverified = uncertain
      return rechecked.map((b, i) => ({
        ...b, canon: checked[i].canon,
        uncertain: !b.ok && !checked[i].canon,
      }));
    }

    // ── Render ───────────────────────────────────────────────────
    function renderResults(srcCanvas, checked) {
      hide(els.processCard); show(els.resultsCard);

      // draw photo + boxes, scaled to a sane width
      const maxW = 880;
      const scale = Math.min(1, maxW / srcCanvas.width);
      const cv = els.overlay;
      cv.width = srcCanvas.width * scale;
      cv.height = srcCanvas.height * scale;
      const ctx = cv.getContext('2d');
      ctx.drawImage(srcCanvas, 0, 0, cv.width, cv.height);
      ctx.lineWidth = Math.max(2, cv.width / 400);
      ctx.font = `bold ${Math.max(12, cv.width / 55)}px sans-serif`;

      // state: ok=green, out-of-order=red, uncertain=yellow
      const stateColor = (l) => l.ok ? '#36d27a' : (l.uncertain ? '#ffce4d' : '#ff5252');
      checked.forEach((l, i) => {
        if (!l.quad) return;
        const color = stateColor(l);
        ctx.strokeStyle = color;
        ctx.beginPath();
        l.quad.forEach((p, j) => {
          const x = p[0] * scale, y = p[1] * scale;
          j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.closePath(); ctx.stroke();
        const bb = bboxOf(l.quad);
        ctx.fillStyle = color;
        ctx.fillText(String(i + 1), bb.x * scale, bb.y * scale - 4);
      });

      const bad = checked.filter(l => !l.ok && !l.uncertain).length;
      const unsure = checked.filter(l => l.uncertain).length;
      els.statTotal.textContent = checked.length;
      els.statOk.textContent = checked.length - bad - unsure;
      els.statBad.textContent = bad + (unsure ? ' + ' + unsure + '?' : '');

      els.resultList.innerHTML = '';
      checked.forEach((l, i) => {
        const div = document.createElement('div');
        div.className = 'item' + (l.ok ? '' : (l.uncertain ? ' unsure' : ' bad'));
        const low = l.score < 0.7;
        const tag = l.ok ? '' : (l.uncertain ? ' &nbsp;🟡 check manually' : ' &nbsp;⚠️ out of order');
        div.innerHTML =
          `<div class="pos">${i + 1}</div>` +
          `<div class="txt">${escapeHtml(l.text)}${tag}${l.canon ? ' &nbsp;<span style="color:#6ee7a8">✓catalog</span>' : ''}</div>` +
          `<div class="conf ${low ? 'low' : ''}">${Math.round(l.score * 100)}%</div>`;
        els.resultList.appendChild(div);
      });
    }

    els.retakeBtn.onclick = () => {
      hide(els.resultsCard); hide(els.errorCard); show(els.inputCard);
      els.startCamBtn.classList.remove('hidden');
      els.uploadBtn.classList.remove('hidden');
      els.snapBtn.classList.add('hidden');
      els.fileInput.value = '';
    };

    // ── UI helpers ───────────────────────────────────────────────
    function setProcess(msg, pct) { els.processMsg.textContent = msg; els.progressBar.style.width = (pct || 0) + '%'; }
    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }
    function showError(msg) {
      hide(els.processCard); show(els.errorCard);
      els.errorMsg.textContent = msg;
      show(els.inputCard);
      els.startCamBtn.classList.remove('hidden');
      els.uploadBtn.classList.remove('hidden');
      els.snapBtn.classList.add('hidden');
    }
    function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
    function safeStringify(o) { try { return JSON.stringify(o, null, 2).slice(0, 6000); } catch { return String(o); } }

  </script>
</body>
